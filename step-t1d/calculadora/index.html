<style>
:root {
  --brand-ink:#0c2340; --brand-blue:#3a70ab; --brand-lens:#6c99c7; --brand-drop:#c8382c;
  --surface:#ffffff; --surface-subtle:#f2f5f9; --surface-raised:#ffffff; --surface-wash:#f1f8ff; --surface-sunken:#e7ecf0; --surface-chart:#f8fafd;
  --surface-inverse:#0c2340; --text-inverse:#ffffff; --text-inverse-soft:#c9d8ea; --hero-rule:rgba(201,216,234,.28);
  --border-hairline:#e7ecf0; --border:#d6dbe1; --border-strong:#b8bec5; --border-control:#6e757d;
  --text:#0c2340; --text-secondary:#555c63; --text-muted:#6e757d; --text-link:#24588f;
  --accent:#3a70ab; --accent-hover:#24588f; --accent-quiet:#6c99c7; --on-accent:#ffffff; --focus-ring:#5283ba;
  --status-good:#0e664d; --status-warning:#8c5e0f; --status-warning-inverse:#f2c27a;
  --chart-cat-1:#3a70ab; --chart-cat-2:#c8382c; --chart-cat-3:#1d9fa0; --chart-grid:#e7ecf0; --chart-axis:#b8bec5;
  --flow-node:#0c2340; --flow-people:#6c99c7; --flow-out:#c4ccd5; --band-opacity:.5; --ribbon-opacity:.3; --ring-opacity:.13;
  --show-light:block; --show-dark:none;
  --shadow-sm:0 1px 2px rgba(12,35,64,.06),0 1px 1px rgba(12,35,64,.04);
  --shadow-md:0 2px 4px rgba(12,35,64,.06),0 8px 16px -6px rgba(12,35,64,.10);
  --shadow-lg:0 4px 8px rgba(12,35,64,.06),0 20px 40px -12px rgba(12,35,64,.16);
  --radius-xs:3px; --radius-sm:6px; --radius-md:10px; --radius-lg:16px;
  --font-display:Archivo,"Helvetica Neue",Helvetica,Arial,sans-serif;
  --font-text:"Source Serif 4",Georgia,"Times New Roman",serif;
  --font-data:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --surface:#0c1723; --surface-subtle:#172534; --surface-raised:#1a2838; --surface-wash:#1c2d3f; --surface-sunken:#060f19; --surface-chart:#0e1a26;
  --surface-inverse:#ffffff; --text-inverse:#0c2340; --text-inverse-soft:#3d4b5c; --hero-rule:rgba(61,75,92,.22);
  --border-hairline:#293747; --border:#38485a; --border-strong:#4d5f75; --border-control:#8894a1;
  --text:#e7eef5; --text-secondary:#aeb9c5; --text-muted:#8894a1; --text-link:#8dbbf0;
  --accent:#76a9e2; --accent-hover:#b0d5fe; --accent-quiet:#6c99c7; --on-accent:#0c2340; --focus-ring:#76afee;
  --status-good:#46b591; --status-warning:#eaa948; --status-warning-inverse:#8c5e0f;
  --chart-cat-1:#4b8fd9; --chart-cat-2:#de5c4d; --chart-cat-3:#1ea4a5; --chart-grid:#223246; --chart-axis:#4d5f75;
  --flow-node:#e7eef5; --flow-people:#6c99c7; --flow-out:#3a4a5c; --band-opacity:.62; --ribbon-opacity:.42; --ring-opacity:.18;
  --show-light:none; --show-dark:block;
  --shadow-sm:0 1px 2px rgba(0,0,0,.5); --shadow-md:0 2px 4px rgba(0,0,0,.4),0 8px 16px -6px rgba(0,0,0,.55); --shadow-lg:0 4px 8px rgba(0,0,0,.4),0 20px 40px -12px rgba(0,0,0,.6);
  color-scheme:dark; } }
:root[data-theme="dark"] {
  --surface:#0c1723; --surface-subtle:#172534; --surface-raised:#1a2838; --surface-wash:#1c2d3f; --surface-sunken:#060f19; --surface-chart:#0e1a26;
  --surface-inverse:#ffffff; --text-inverse:#0c2340; --text-inverse-soft:#3d4b5c; --hero-rule:rgba(61,75,92,.22);
  --border-hairline:#293747; --border:#38485a; --border-strong:#4d5f75; --border-control:#8894a1;
  --text:#e7eef5; --text-secondary:#aeb9c5; --text-muted:#8894a1; --text-link:#8dbbf0;
  --accent:#76a9e2; --accent-hover:#b0d5fe; --accent-quiet:#6c99c7; --on-accent:#0c2340; --focus-ring:#76afee;
  --status-good:#46b591; --status-warning:#eaa948; --status-warning-inverse:#8c5e0f;
  --chart-cat-1:#4b8fd9; --chart-cat-2:#de5c4d; --chart-cat-3:#1ea4a5; --chart-grid:#223246; --chart-axis:#4d5f75;
  --flow-node:#e7eef5; --flow-people:#6c99c7; --flow-out:#3a4a5c; --band-opacity:.62; --ribbon-opacity:.42; --ring-opacity:.18;
  --show-light:none; --show-dark:block;
  --shadow-sm:0 1px 2px rgba(0,0,0,.5); --shadow-md:0 2px 4px rgba(0,0,0,.4),0 8px 16px -6px rgba(0,0,0,.55); --shadow-lg:0 4px 8px rgba(0,0,0,.4),0 20px 40px -12px rgba(0,0,0,.6);
  color-scheme:dark; }
*,*::before,*::after { box-sizing:border-box; }
[hidden] { display:none!important; }
body { margin:0; background:var(--surface); color:var(--text); font-family:var(--font-display); -webkit-font-smoothing:antialiased; line-height:1.45; overflow-wrap:break-word; }
.wrap { max-width:1120px; margin:0 auto; padding-inline:16px; }
:focus-visible { outline:2px solid var(--focus-ring); outline-offset:2px; }
.logo-light { display:var(--show-light); } .logo-dark { display:var(--show-dark); }
.logo-light svg, .logo-dark svg { display:block; height:auto; width:170px; max-width:100%; }
.mast { border-bottom:1px solid var(--border-hairline); }
.mast .wrap { display:flex; justify-content:flex-end; align-items:center; padding-block:10px; }
.lang { display:inline-flex; gap:2px; padding:2px; border:1px solid var(--border); border-radius:var(--radius-sm); }
.lang button { background:transparent; border:0; border-radius:4px; padding:6px 12px; font:600 13px/18px var(--font-display); color:var(--text-link); cursor:pointer; }
.lang button[aria-current="true"] { background:var(--accent); color:var(--on-accent); }
.hero { background:var(--surface-inverse); color:var(--text-inverse); }
.hero .wrap { padding-block:20px; display:flex; flex-wrap:wrap; gap:8px 24px; align-items:center; }
.hero h1 { font-size:clamp(20px, 3.4vw, 28px); margin:0; letter-spacing:-.01em; }
.badge { display:inline-block; font-size:12px; font-weight:600; color:var(--status-warning-inverse); border:1px solid currentColor; border-radius:var(--radius-sm); padding:2px 8px; }
.stepper { list-style:none; margin:24px 0 0; padding:0; display:flex; flex-wrap:wrap; gap:8px; font-size:14px; }
.stepper a { display:block; text-decoration:none; border:1px solid var(--border); border-radius:4px; padding:8px 12px; color:var(--text-secondary); }
.stepper a:hover { border-color:var(--accent); color:var(--text); }
.stepper a.done { color:var(--text); }
.stepper a[aria-current="step"] { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
.step { padding-block:28px 40px; display:flex; flex-direction:column; gap:24px; }
.intro { display:flex; flex-direction:column; gap:12px; max-width:780px; }
.kicker { margin:0; font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-secondary); }
.step h2 { margin:0; font-size:clamp(28px, 5vw, 42px); line-height:1.1; letter-spacing:-.02em; }
.step h3 { margin:0; font-size:22px; line-height:1.25; }
.lede { margin:0; font-family:var(--font-text); font-size:clamp(17px, 2.2vw, 20px); line-height:1.5; }
.prose p, .prose li, p.prose { font-family:var(--font-text); font-size:17px; line-height:1.55; margin:0; }
.prose { display:flex; flex-direction:column; gap:10px; }
.prose ul { margin:0; padding-left:20px; display:flex; flex-direction:column; gap:6px; }
.cards { display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:16px; }
.card { border:1px solid var(--border); border-radius:8px; padding:18px; display:flex; flex-direction:column; gap:8px; min-width:0; background:var(--surface); }
.card .t { margin:0; font-weight:700; font-size:17px; }
.card .src { margin:0; font-family:var(--font-data); font-size:13px; color:var(--text-secondary); }
.wash { background:var(--surface-wash); border-radius:8px; padding:24px; display:flex; flex-wrap:wrap; gap:24px 32px; align-items:center; }
.wash > div { flex:1 1 300px; min-width:0; display:flex; flex-direction:column; gap:10px; }
.wash .t { margin:0; font-size:20px; font-weight:700; }
.note { border-left:4px solid var(--status-warning); background:var(--surface-subtle); border-radius:0 8px 8px 0; padding:16px 20px; display:flex; flex-direction:column; gap:8px; }
.note .t { margin:0; font-weight:700; color:var(--status-warning); font-size:17px; }
.info { border-left:4px solid var(--accent); background:var(--surface-wash); border-radius:0 8px 8px 0; padding:16px 20px; display:flex; flex-direction:column; gap:8px; }
.info .t { margin:0; font-weight:700; font-size:17px; }
details.more { border:1px solid var(--border); border-radius:8px; padding:14px 18px; }
details.more summary { font-weight:600; cursor:pointer; }
details.more > :not(summary) { margin-top:12px; }
.scroll { overflow-x:auto; max-width:100%; }
table { border-collapse:collapse; width:100%; font-size:14px; }
th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--border-hairline); vertical-align:middle; }
th { font-size:13px; color:var(--text-secondary); font-weight:600; }
td.num, th.num { text-align:right; }
.mono { font-family:var(--font-data); }
td.num, td.pat { font-family:var(--font-data); white-space:nowrap; }
tr.drop td { color:var(--text-muted); text-decoration:line-through; }
tr.drop td:last-child { text-decoration:none; }
tr.hl td { background:var(--surface-wash); }
.tag { display:inline-block; font-size:12px; font-weight:600; border-radius:4px; padding:1px 6px; border:1px solid var(--border-strong); }
.tag.good { color:var(--status-good); border-color:currentColor; }
.tag.warn { color:var(--status-warning); border-color:currentColor; }
.substeps { list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:6px; font-size:14px; }
.substeps button { font:inherit; background:var(--surface); border:1px solid var(--border); border-radius:4px; padding:6px 10px; color:var(--text-secondary); cursor:pointer; }
.substeps button[aria-current="step"] { border-color:var(--accent); color:var(--text); box-shadow:inset 0 -3px 0 var(--accent); }
.panel { border:1px solid var(--border); border-radius:8px; padding:20px; display:flex; flex-direction:column; gap:14px; min-width:0; }
.split { display:grid; grid-template-columns:minmax(0,1.2fr) minmax(0,1fr); gap:24px; align-items:start; }
@media (max-width:820px) { .split { grid-template-columns:minmax(0,1fr); } }
.counts input { width:100px; font:16px var(--font-data); color:var(--text); background:var(--surface); border:1px solid var(--border-control); border-radius:4px; padding:6px 8px; text-align:right; }
.counts label { display:flex; align-items:center; justify-content:flex-end; gap:8px; }
.counts .lbl { font-size:12px; color:var(--text-secondary); }
.vis { display:flex; flex-direction:column; gap:12px; align-items:center; }
.vis svg { width:100%; max-width:360px; height:auto; }
.vis svg text { font-family:var(--font-data); fill:var(--text); }
.vis svg .cl { font-family:var(--font-display); font-weight:700; }
.row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.btn { font:600 15px/20px var(--font-display); padding:10px 16px; border-radius:4px; border:1px solid var(--border-control); background:var(--surface); color:var(--text); cursor:pointer; text-decoration:none; display:inline-block; }
.btn.primary { background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
.btn.primary:hover { background:var(--accent-hover); border-color:var(--accent-hover); }
.btn[aria-pressed="true"] { border-color:var(--accent); box-shadow:inset 0 -3px 0 var(--accent); }
.btn:disabled { opacity:.55; cursor:not-allowed; }
.pager { display:flex; flex-wrap:wrap; justify-content:space-between; gap:12px; border-top:1px solid var(--border-hairline); padding-top:20px; }
.pager .end { margin-left:auto; display:flex; flex-wrap:wrap; gap:12px; }
.moves { display:grid; grid-template-columns:repeat(auto-fit, minmax(230px, 1fr)); gap:16px; }
.big { margin:0; font-family:var(--font-data); font-size:28px; font-weight:500; }
.small { margin:0; font-family:var(--font-data); font-size:13px; color:var(--text-secondary); }
input[type=range] { width:100%; accent-color:var(--accent); }
textarea { width:100%; min-height:110px; font:14px var(--font-data); color:var(--text); background:var(--surface); border:1px solid var(--border-control); border-radius:4px; padding:8px; }
.models { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:12px; }
.models .card .small b { color:var(--text); }
.hero-num { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.6fr); gap:24px; align-items:center; }
@media (max-width:820px) { .hero-num { grid-template-columns:minmax(0,1fr); } }
.answer { background:var(--surface-inverse); color:var(--text-inverse); border-radius:8px; padding:24px; display:flex; flex-direction:column; gap:6px; }
.answer .l { margin:0; font-size:15px; color:var(--text-inverse-soft); }
.answer .v { margin:0; font-family:var(--font-data); font-size:clamp(40px, 8vw, 60px); font-weight:500; line-height:1.05; }
.stack { display:flex; height:44px; border-radius:6px; overflow:hidden; font-size:13px; font-weight:600; }
.stack > div { display:flex; align-items:center; padding:0 10px; white-space:nowrap; overflow:hidden; min-width:0; }
.stack .k { background:var(--accent); color:var(--on-accent); }
.stack .m { background:repeating-linear-gradient(45deg, var(--surface-sunken), var(--surface-sunken) 6px, var(--surface-subtle) 6px, var(--surface-subtle) 12px); color:var(--text); border:1px dashed var(--border-control); }
.bars { display:flex; flex-direction:column; gap:8px; }
.bar { display:grid; grid-template-columns:minmax(0,9em) minmax(0,1fr) 4.5em; gap:8px; align-items:center; font-size:13px; }
.bar .track { height:12px; background:var(--surface-sunken); border-radius:3px; overflow:hidden; }
.bar .fill { height:100%; background:var(--accent); }
.bar .val { font-family:var(--font-data); text-align:right; }
.grid3 { display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:16px; }
progress { width:100%; height:10px; }
.err { color:var(--brand-drop); font-weight:600; }
.muted { color:var(--text-secondary); font-size:14px; margin:0; }
footer { padding-block:24px; font-size:13px; color:var(--text-muted); border-top:1px solid var(--border-hairline); }
@media (max-width:520px) { .step { padding-block:20px 32px; } .panel, .wash { padding:16px; } th, td { padding:6px; } .counts input { width:76px; } .bar { grid-template-columns:minmax(0,7em) minmax(0,1fr) 4em; } }
</style>
<style id="sitenav-css">

.sn { display:flex; flex-wrap:wrap; align-items:center; gap:4px 16px; font-size:14px; font-weight:600; min-width:0; }
.sn a { color:var(--text-link); text-decoration:none; padding:4px 0; }
.sn a:hover { text-decoration:underline; text-underline-offset:3px; }
.sn .sn-home { color:var(--text); font-weight:700; letter-spacing:.02em; }
