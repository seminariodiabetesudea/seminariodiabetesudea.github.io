<style>
/* Layout: a light masthead, the thesis on surface-inverse, then one figure: a vertical, to-scale
   flow of records and people (lists at the top, each exclusion turning right into a labelled
   column, the three-list overlap inside the box of everyone at the bottom), with the detail panel
   beside it, and the steps still to come.
   Tokens copied from the STEP-T1D design system (tokens.css, version 1793527154-db53). */
:root {
  --brand-ink:#0c2340; --brand-blue:#3a70ab; --brand-lens:#6c99c7; --brand-drop:#c8382c;
  --surface:#ffffff; --surface-subtle:#f2f5f9; --surface-raised:#ffffff; --surface-wash:#f1f8ff; --surface-sunken:#e7ecf0; --surface-chart:#f8fafd;
  --surface-inverse:#0c2340; --text-inverse:#ffffff; --text-inverse-soft:#c9d8ea; --hero-rule:rgba(201,216,234,.28);
  --border-hairline:#e7ecf0; --border:#d6dbe1; --border-strong:#b8bec5; --border-control:#6e757d;
  --text:#0c2340; --text-secondary:#555c63; --text-muted:#6e757d; --text-link:#24588f;
  --accent:#3a70ab; --accent-hover:#24588f; --accent-quiet:#6c99c7; --on-accent:#ffffff; --focus-ring:#5283ba;
  --status-good:#0e664d; --status-warning:#8c5e0f; --status-warning-inverse:#f2c27a;
  --chart-cat-1:#3a70ab; --chart-cat-2:#c8382c; --chart-cat-3:#1d9fa0; --chart-nodata:#dfe4ea; --opacity-hatch:.55; --chart-grid:#e7ecf0; --chart-axis:#b8bec5;
  --flow-node:#0c2340; --flow-people:#6c99c7; --flow-out:#c4ccd5; --band-opacity:.5; --ribbon-opacity:.3; --ring-opacity:.13;
  --show-light:block; --show-dark:none;
  --shadow-sm:0 1px 2px rgba(12,35,64,.06),0 1px 1px rgba(12,35,64,.04);
  --shadow-md:0 2px 4px rgba(12,35,64,.06),0 8px 16px -6px rgba(12,35,64,.10);
  --shadow-lg:0 4px 8px rgba(12,35,64,.06),0 20px 40px -12px rgba(12,35,64,.16);
  --radius-xs:3px; --radius-sm:6px; --radius-md:10px; --radius-lg:16px;
  --font-display:Archivo,"Helvetica Neue",Helvetica,Arial,sans-serif;
  --font-text:"Source Serif 4",Georgia,"Times New Roman",serif;
  --font-data:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --surface:#0c1723; --surface-subtle:#172534; --surface-raised:#1a2838; --surface-wash:#1c2d3f; --surface-sunken:#060f19; --surface-chart:#0e1a26;
  --surface-inverse:#ffffff; --text-inverse:#0c2340; --text-inverse-soft:#3d4b5c; --hero-rule:rgba(61,75,92,.22);
  --border-hairline:#293747; --border:#38485a; --border-strong:#4d5f75; --border-control:#8894a1;
  --text:#e7eef5; --text-secondary:#aeb9c5; --text-muted:#8894a1; --text-link:#8dbbf0;
  --accent:#76a9e2; --accent-hover:#b0d5fe; --accent-quiet:#6c99c7; --on-accent:#0c2340; --focus-ring:#76afee;
  --status-good:#46b591; --status-warning:#eaa948; --status-warning-inverse:#8c5e0f;
  --chart-cat-1:#4b8fd9; --chart-cat-2:#de5c4d; --chart-cat-3:#1ea4a5; --chart-nodata:#2c3b4d; --opacity-hatch:.6; --chart-grid:#223246; --chart-axis:#4d5f75;
  --flow-node:#e7eef5; --flow-people:#6c99c7; --flow-out:#3a4a5c; --band-opacity:.62; --ribbon-opacity:.42; --ring-opacity:.18;
  --show-light:none; --show-dark:block;
  --shadow-sm:0 1px 2px rgba(0,0,0,.5); --shadow-md:0 2px 4px rgba(0,0,0,.4),0 8px 16px -6px rgba(0,0,0,.55); --shadow-lg:0 4px 8px rgba(0,0,0,.4),0 20px 40px -12px rgba(0,0,0,.6);
  color-scheme:dark; } }
:root[data-theme="dark"] {
  --surface:#0c1723; --surface-subtle:#172534; --surface-raised:#1a2838; --surface-wash:#1c2d3f; --surface-sunken:#060f19; --surface-chart:#0e1a26;
  --surface-inverse:#ffffff; --text-inverse:#0c2340; --text-inverse-soft:#3d4b5c; --hero-rule:rgba(61,75,92,.22);
  --border-hairline:#293747; --border:#38485a; --border-strong:#4d5f75; --border-control:#8894a1;
  --text:#e7eef5; --text-secondary:#aeb9c5; --text-muted:#8894a1; --text-link:#8dbbf0;
  --accent:#76a9e2; --accent-hover:#b0d5fe; --accent-quiet:#6c99c7; --on-accent:#0c2340; --focus-ring:#76afee;
  --status-good:#46b591; --status-warning:#eaa948; --status-warning-inverse:#8c5e0f;
  --chart-cat-1:#4b8fd9; --chart-cat-2:#de5c4d; --chart-cat-3:#1ea4a5; --chart-nodata:#2c3b4d; --opacity-hatch:.6; --chart-grid:#223246; --chart-axis:#4d5f75;
  --flow-node:#e7eef5; --flow-people:#6c99c7; --flow-out:#3a4a5c; --band-opacity:.62; --ribbon-opacity:.42; --ring-opacity:.18;
  --show-light:none; --show-dark:block;
  --shadow-sm:0 1px 2px rgba(0,0,0,.5); --shadow-md:0 2px 4px rgba(0,0,0,.4),0 8px 16px -6px rgba(0,0,0,.55); --shadow-lg:0 4px 8px rgba(0,0,0,.4),0 20px 40px -12px rgba(0,0,0,.6);
  color-scheme:dark; }

*,*::before,*::after { box-sizing:border-box; }
[hidden] { display:none!important; }
body { margin:0; background:var(--surface); color:var(--text); font-family:var(--font-display); -webkit-font-smoothing:antialiased; }
h1,h2,h3,p,ol,ul { margin:0; }
ol,ul { padding:0; list-style:none; }
button { font:inherit; color:inherit; }
.wrap { max-width:1200px; margin:0 auto; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); }
:focus-visible { outline:2px solid var(--focus-ring); outline-offset:2px; }
@media (prefers-reduced-motion: reduce) { *,*::before,*::after { transition:none!important; animation:none!important; scroll-behavior:auto!important; } }
.logo-light { display:var(--show-light); } .logo-dark { display:var(--show-dark); }
.logo-light svg, .logo-dark svg { display:block; height:auto; }

/* masthead */
.mast { background:var(--surface); border-bottom:1px solid var(--border-hairline); }
.mast .wrap { display:flex; align-items:center; justify-content:flex-end; gap:16px; padding-block:12px; min-height:60px; }
.lang { display:inline-flex; gap:2px; padding:2px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--surface); }
.lang button { background:transparent; border:0; border-radius:4px; padding:6px 12px; font-size:13px; line-height:18px; font-weight:600; letter-spacing:.04em; color:var(--text-link); cursor:pointer; }
.lang button[aria-current="true"] { background:var(--accent); color:var(--on-accent); }

/* hero */
.hero { background:var(--surface-inverse); color:var(--text-inverse); }
.hero .wrap { padding-block:48px 56px; display:grid; gap:32px; }
.hero-logo svg { width:230px; }
.hero-grid { display:grid; grid-template-columns:minmax(0, 7fr) minmax(0, 5fr); gap:48px; align-items:end; }
.ticks { display:flex; align-items:flex-end; height:10px; }
.ticks i { display:block; width:1px; height:4px; background:var(--brand-lens); margin-right:15px; }
.ticks i:nth-child(5n+1) { height:9px; background:var(--text-inverse-soft); }
.eyebrow { font-size:12px; line-height:16px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; }
.hero .eyebrow { color:var(--text-inverse-soft); margin-top:12px; }
.hero h1 { font-size:clamp(34px, 5vw, 56px); line-height:1.04; font-weight:700; letter-spacing:-.025em; text-wrap:balance; margin-top:12px; }
.hero .lead { font-family:var(--font-text); font-size:18px; line-height:30px; color:var(--text-inverse-soft); max-width:62ch; margin-top:20px; }
.hero .lead strong { color:var(--text-inverse); font-weight:600; }
.prelim { display:inline-flex; align-items:flex-start; gap:8px; font-size:13px; line-height:18px; font-weight:500; margin-top:20px; color:var(--status-warning-inverse); }
.prelim svg { width:15px; height:15px; flex:none; margin-top:1px; }
.stats { display:grid; grid-template-columns:auto minmax(0, 1fr); column-gap:20px; }
.stat { display:grid; grid-column:1 / -1; grid-template-columns:subgrid; align-items:baseline; padding-block:16px; border-top:1px solid var(--hero-rule); }
.stat:first-child { border-top:0; padding-top:0; }
.stat .v { font-size:44px; line-height:1; font-weight:700; letter-spacing:-.03em; text-align:right; white-space:nowrap; }
.stat .l { font-size:15px; line-height:20px; font-weight:500; color:var(--text-inverse-soft); }
.stat .l b { display:block; color:var(--text-inverse); font-weight:600; }

/* figure */
.figsec { padding-block:48px 32px; }
.fig { background:var(--surface-chart); border:1px solid var(--border); border-radius:var(--radius-lg); padding:24px; display:grid; gap:16px; }
/* AA on the chart surface: muted ink (#6e757d) on #f8fafd is 4.45:1, so inside the figure card it steps up to secondary ink. */
.fig { --text-muted: var(--text-secondary); }
.fig-top { display:flex; flex-wrap:wrap; align-items:center; gap:8px 16px; }
.fnum { font-size:12px; line-height:16px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--text-muted); }
.fig h2 { font-size:clamp(20px, 2.2vw, 26px); line-height:1.25; font-weight:600; letter-spacing:-.01em; text-wrap:balance; max-width:36ch; }
.controls { display:flex; flex-wrap:wrap; gap:16px 32px; align-items:flex-start; }
.ctl { display:grid; gap:8px; min-width:0; }
.ctl .lbl { font-size:12px; line-height:16px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--text-muted); }
.seg { display:flex; flex-wrap:wrap; gap:4px; }
.seg label { position:relative; display:inline-flex; }
.seg input { position:absolute; inset:0; width:100%; height:100%; opacity:0; margin:0; cursor:pointer; }
.seg span { padding:7px 12px; border:1px solid var(--border); border-radius:var(--radius-sm); font-size:13px; line-height:18px; font-weight:500; color:var(--text-secondary); background:var(--surface); transition:background-color .15s ease, color .15s ease; }
.seg label:hover span { border-color:var(--border-strong); color:var(--text); }
.seg input:checked + span { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
.seg input:focus-visible + span { outline:2px solid var(--focus-ring); outline-offset:2px; }
.delta { font-family:var(--font-data); font-size:12px; line-height:17px; color:var(--text-secondary); min-height:17px; }
.legend { display:flex; flex-wrap:wrap; gap:8px 20px; align-items:center; }
.legend span { display:inline-flex; align-items:center; gap:8px; font-size:13px; line-height:18px; font-weight:500; color:var(--text-secondary); }
.legend i { width:12px; height:12px; border-radius:2px; flex:none; }
.legend svg { display:block; }
.fig-body { display:grid; grid-template-columns:minmax(0, 1fr); gap:24px; align-items:start; }
.canvas { position:relative; min-width:0; }
.canvas svg.vz { display:block; width:100%; height:auto; overflow:visible; }
.cap { font-size:13px; line-height:19px; color:var(--text-secondary); max-width:92ch; }
.src { font-family:var(--font-data); font-size:12px; line-height:17px; color:var(--text-muted); }
.tbl-toggle { justify-self:start; background:transparent; border:0; padding:0; color:var(--text-link); font-size:14px; font-weight:500; cursor:pointer; text-decoration:underline; text-underline-offset:3px; }
.tables { display:grid; gap:20px; }
.fig > *, .tables > * { min-width:0; } /* a wide table scrolls inside its own box instead of widening the card */
.tbl-wrap { overflow-x:auto; }
.tables h3 { font-size:14px; line-height:20px; font-weight:600; margin-bottom:6px; }
table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
th, td { text-align:left; padding:6px 10px; vertical-align:top; }
thead th { background:var(--surface-subtle); font-size:12px; font-weight:600; color:var(--text-secondary); border-bottom:1px solid var(--border); }
td { font-family:var(--font-data); font-size:12.5px; white-space:nowrap; border-bottom:1px solid var(--border-hairline); }
td:first-child { font-family:var(--font-display); font-weight:500; font-size:13px; }


/* site nav (shared with the other pages) */
.mast .wrap { flex-wrap:wrap; justify-content:space-between; gap:8px 16px; }
.sn { display:flex; flex-wrap:wrap; align-items:center; gap:4px 16px; font-size:14px; font-weight:600; min-width:0; }
.sn a { color:var(--text-link); text-decoration:none; padding:4px 0; }
.sn a:hover { text-decoration:underline; text-underline-offset:3px; }
.sn .sn-home { color:var(--text); font-weight:700; letter-spacing:.02em; }
.sn a[aria-current="page"] { color:var(--text); text-decoration:underline; text-decoration-color:var(--accent); text-decoration-thickness:2px; text-underline-offset:6px; }
html[lang="en"] .sn [lang="es"], html:not([lang="en"]) .sn [lang="en"] { display:none; }
@media (max-width:520px) { .sn { gap:2px 12px; font-size:13px; } }

/* banner + masthead tools */
.banner { background:#fff4e0; color:#5c3a00; border-bottom:3px solid #c8382c; }
:root[data-theme="dark"] .banner { background:#3a2606; color:#ffe2b0; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .banner { background:#3a2606; color:#ffe2b0; } }
.banner .wrap { display:flex; gap:12px; align-items:flex-start; padding-block:16px; }
.banner svg { width:22px; height:22px; flex:none; margin-top:2px; color:#c8382c; }
.banner p { font-size:15px; line-height:22px; max-width:100ch; }
.banner strong { font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
.banner a { color:inherit; font-weight:600; }
.theme-btn { background:transparent; border:1px solid var(--border); border-radius:var(--radius-sm); padding:6px 10px; font-size:13px; color:var(--text-link); cursor:pointer; }
.tools { display:flex; gap:8px; align-items:center; }
.prelim-tag { display:inline-block; font-size:11px; line-height:16px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:#fff; background:#c8382c; padding:2px 8px; border-radius:var(--radius-xs); }

/* dashboard */
.dash { display:grid; gap:24px; padding-block:32px 48px; }
.top { display:grid; grid-template-columns:minmax(0, 5fr) minmax(0, 7fr); gap:24px; align-items:start; }
.card { background:var(--surface-raised); border:1px solid var(--border); border-radius:var(--radius-lg); box-shadow:var(--shadow-sm); padding:20px; display:grid; gap:16px; min-width:0; }
.card > * { min-width:0; }
.card-h { display:grid; grid-template-columns:auto minmax(0, 1fr) auto; gap:12px; align-items:center; }
.card-h .prelim-tag { white-space:normal; max-width:132px; text-align:center; }
.ic { width:36px; height:36px; border-radius:var(--radius-md); background:var(--surface-wash); color:var(--accent); display:grid; place-items:center; }
.ic svg { width:20px; height:20px; }
.card-h h2, .card-h h3 { font-size:17px; line-height:22px; font-weight:600; letter-spacing:-.005em; }
.sub { font-size:11px; line-height:16px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--text-muted); margin-top:2px; }
.chev { width:32px; height:32px; display:grid; place-items:center; background:transparent; border:1px solid transparent; border-radius:var(--radius-sm); color:var(--text-secondary); cursor:pointer; }
.chev:hover { border-color:var(--border); color:var(--text); }
.chev svg { width:18px; height:18px; transition:transform .15s ease; }
.chev[aria-expanded="false"] svg { transform:rotate(-90deg); }
.card-b { display:grid; gap:12px; min-width:0; }
.card-b > * { min-width:0; }
dl.details { display:grid; grid-template-columns:auto minmax(0, 1fr); gap:0 16px; margin:0; }
dl.details dt, dl.details dd { padding-block:10px; border-top:1px solid var(--border-hairline); margin:0; font-size:14px; line-height:20px; }
dl.details dt:first-of-type, dl.details dd:first-of-type { border-top:0; padding-top:0; }
dl.details dt { color:var(--text-muted); font-size:12px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; padding-top:12px; }
dl.details dt:first-of-type { padding-top:2px; }
dl.details dd { font-weight:500; }
dl.details dd small { display:block; color:var(--text-secondary); font-weight:400; font-size:13px; }
.period { font-size:13px; line-height:18px; color:var(--text-secondary); }
.period b { color:var(--text); font-weight:600; }
.tbl-wrap { overflow-x:auto; }
table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
th, td { text-align:left; padding:7px 10px; vertical-align:top; }
th.n, td.n { text-align:right; }
thead th { background:var(--surface-subtle); font-size:12px; font-weight:600; color:var(--text-secondary); border-bottom:1px solid var(--border); white-space:nowrap; }
td { font-family:var(--font-data); font-size:12.5px; white-space:nowrap; border-bottom:1px solid var(--border-hairline); }
td:first-child { font-family:var(--font-display); font-weight:500; font-size:13px; }
tr.sec td { font-family:var(--font-display); font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--text-muted); background:transparent; padding-top:12px; }
tr.tot td { font-weight:700; border-top:1px solid var(--border-strong); }
td.sup { background-image:repeating-linear-gradient(45deg, transparent 0 4px, color-mix(in srgb, var(--text-muted) 40%, transparent) 4px 5px); background-color:var(--chart-nodata); }
td small { color:var(--text-muted); }

.filters { display:flex; flex-wrap:wrap; align-items:end; justify-content:space-between; gap:12px 24px; border-bottom:1px solid var(--border); }
.tabs { display:flex; flex-wrap:wrap; gap:4px 20px; }
.tabs button { background:transparent; border:0; border-bottom:2px solid transparent; padding:10px 0 9px; margin-bottom:-1px; font-size:14px; font-weight:600; color:var(--text-secondary); cursor:pointer; }
.tabs button:hover { color:var(--text); }
.tabs button[aria-selected="true"] { color:var(--text); border-bottom-color:var(--accent); }
.mctl { display:grid; gap:4px; padding-bottom:10px; min-width:0; max-width:340px; width:100%; }
.mctl label { font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--text-muted); }
select { font:inherit; font-size:14px; padding:7px 10px; border:1px solid var(--border-control); border-radius:var(--radius-sm); background:var(--surface); color:var(--text); width:100%; min-width:0; text-overflow:ellipsis; }

    let run = []; const runs = [];
    rows.forEach((r, i) => { if (isSup(r, metric)) { if (run.length) runs.push(run); run = []; } else run.push(i); });
    if (run.length) runs.push(run);
    runs.forEach((rn) => {
      const up = rn.map((i) => `${x(i)},${y(rows[i][metric][2])}`), dn = rn.slice().reverse().map((i) => `${x(i)},${y(rows[i][metric][1])}`);
      o.push(`<path class="band" d="M${up.join("L")}L${dn.join("L")}Z"/>`);
      o.push(`<path class="line" d="M${rn.map((i) => `${x(i)},${y(rows[i][metric][0])}`).join("L")}"/>`);
    });
    rows.forEach((r, i) => {
      if (isSup(r, metric)) { supBox(o, x(i) - 10, y(hi * 0.25), 20, y(0) - y(hi * 0.25), x(i)); return; }
      if (withReg) o.push(`<rect class="reg" x="${x(i) - 4}" y="${y(r.registered) - 4}" width="8" height="8"/>`);
      o.push(`<circle class="med" cx="${x(i)}" cy="${y(r[metric][0])}" r="4.5"/>`);
    });
    const ends = [0, rows.length - 1].filter((i) => !isSup(rows[i], metric));
    ends.forEach((i) => o.push(`<text class="lab" x="${x(i) + (i === 0 ? 6 : -6)}" y="${y(rows[i][metric][2]) - 6}" text-anchor="${i === 0 ? "start" : "end"}">${esc(fmt(rows[i][metric][0], metric))}</text>`));
    rows.forEach((r, i) => {
      const tip = isSup(r, metric) ? `${r.group}: ${supTxt()}` : `${r.group}: ${fmt(r[metric][0], metric)} (${ci(r[metric], metric)})${withReg ? " · " + L().legReg + ": " + fmt(r.registered, "N") : ""}`;
      o.push(`<rect class="hit" x="${x(i) - step / 2}" y="${mt}" width="${step}" height="${h - mt - mb}"><title>${esc(tip)}</title></rect>`);
    });
    o.push(`</svg>`); return o.join("");
  }

  /* vertical categorical: bars (median + whisker) or dots */
  function catV(w, rows, view, metric, mode, withReg, label) {
    const h = 230, o = []; o.w = w; o.ml = metric === "completeness" ? 52 : 40; o.mr = 10; const mt = 14, mb = 28;
    const vals = []; rows.forEach((r) => { if (!isSup(r, metric)) vals.push(r[metric][2]); if (withReg && !r.suppressed) vals.push(r.registered); });
    const hi = metric === "completeness" ? 1 : niceMax(Math.max(1, ...vals) * 1.05), lo = 0;
    const y = (v) => mt + (h - mt - mb) * (1 - (v - lo) / (hi - lo));
    const bw = (w - o.ml - o.mr) / rows.length, x = (i) => o.ml + bw * (i + 0.5);
    const barW = Math.min(56, bw * 0.5);
    o.push(svgOpen(w, h, label)); yAxis(o, lo, hi, metric, y, 5);
    rows.forEach((r, i) => {
      const cx = x(i);
      o.push(`<text x="${cx}" y="${h - 8}" text-anchor="middle">${esc(groupName(view, r.group))}</text>`);
      if (isSup(r, metric)) { supBox(o, cx - barW / 2, y(hi * 0.3), barW, y(0) - y(hi * 0.3), cx); return; }
      const q = r[metric];
      if (mode === "bar") {
        const top = y(q[0]), rr = 3;
        o.push(`<path class="bar1" d="M${cx - barW / 2},${y(0)}V${top + rr}Q${cx - barW / 2},${top} ${cx - barW / 2 + rr},${top}H${cx + barW / 2 - rr}Q${cx + barW / 2},${top} ${cx + barW / 2},${top + rr}V${y(0)}Z"/>`);
        o.push(`<line class="whisk" x1="${cx}" x2="${cx}" y1="${y(q[1])}" y2="${y(q[2])}"/><line class="whisk" x1="${cx - 5}" x2="${cx + 5}" y1="${y(q[1])}" y2="${y(q[1])}"/><line class="whisk" x1="${cx - 5}" x2="${cx + 5}" y1="${y(q[2])}" y2="${y(q[2])}"/>`);
        o.push(`<text class="lab" x="${cx + barW / 2 + 4}" y="${top + 4}">${esc(fmt(q[0], metric))}</text>`);
      } else {
        o.push(`<line class="line" style="stroke-width:3;stroke-linecap:round" x1="${cx}" x2="${cx}" y1="${y(q[1])}" y2="${y(q[2])}"/><circle class="med" cx="${cx}" cy="${y(q[0])}" r="6"/>`);
        if (withReg) o.push(`<rect class="reg" x="${cx - 18}" y="${y(r.registered) - 5}" width="10" height="10"/>`);
        o.push(`<text class="lab" x="${cx + 10}" y="${y(q[0]) + 4}">${esc(fmt(q[0], metric))}</text>`);
      }
      o.push(`<rect class="hit" x="${cx - bw / 2}" y="${mt}" width="${bw}" height="${h - mt - mb}"><title>${esc(groupName(view, r.group) + ": " + fmt(q[0], metric) + " (" + ci(q, metric) + ")" + (withReg ? " · " + L().legReg + ": " + fmt(r.registered, "N") : ""))}</title></rect>`);
    });
    o.push(`<line class="axis" x1="${o.ml}" x2="${w - o.mr}" y1="${y(0)}" y2="${y(0)}"/>`);
    o.push(`</svg>`); return o.join("");
  }

  /* paired horizontal bars: registered (cat-3) vs estimated median (cat-1) with whisker */
  function pairedH(w, rows, view, label) {
    const rowH = 64, mt = 6, mb = 24, ml = Math.min(110, Math.max(70, w * 0.2)), mr = 44, h = mt + mb + rowH * rows.length, o = []; o.w = w;
    const vals = []; rows.forEach((r) => { if (!isSup(r, "N")) vals.push(r.N[2], r.registered); });
    const hi = niceMax(Math.max(1, ...vals) * 1.02);
    const x = (v) => ml + (w - ml - mr) * v / hi;
    o.push(svgOpen(w, h, label));
    for (let k = 0; k <= 4; k++) { const v = hi * k / 4; o.push(`<line class="grid-l" x1="${x(v)}" x2="${x(v)}" y1="${mt}" y2="${h - mb}"/><text x="${x(v)}" y="${h - 6}" text-anchor="middle">${esc(fmt(v, "N"))}</text>`); }
    rows.forEach((r, i) => {
      const y0 = mt + rowH * i + 8, bh = 18;
      o.push(`<text class="nm" x="${ml - 10}" y="${y0 + bh + 6}" text-anchor="end">${esc(groupName(view, r.group))}</text>`);
      if (isSup(r, "N")) { supBox(o, ml, y0, (w - ml - mr) * 0.4, bh * 2 + 2, ml + (w - ml - mr) * 0.2); return; }
      const bar = (cls, v, yy) => { const x1 = x(v), rr = 3; return `<path class="${cls}" d="M${ml},${yy}H${x1 - rr}Q${x1},${yy} ${x1},${yy + rr}V${yy + bh - rr}Q${x1},${yy + bh} ${x1 - rr},${yy + bh}H${ml}Z"/>`; };
      o.push(bar("bar3", r.registered, y0));
      o.push(`<text class="lab" x="${x(r.registered) + 5}" y="${y0 + 13}">${esc(fmt(r.registered, "N"))}</text>`);
      const y1 = y0 + bh + 2; o.push(bar("bar1", r.N[0], y1));
      o.push(`<line class="whisk" x1="${x(r.N[1])}" x2="${x(r.N[2])}" y1="${y1 + bh / 2}" y2="${y1 + bh / 2}"/><line class="whisk" x1="${x(r.N[1])}" x2="${x(r.N[1])}" y1="${y1 + 5}" y2="${y1 + bh - 5}"/><line class="whisk" x1="${x(r.N[2])}" x2="${x(r.N[2])}" y1="${y1 + 5}" y2="${y1 + bh - 5}"/>`);
      o.push(`<text class="lab" x="${x(r.N[2]) + 5}" y="${y1 + 13}">${esc(fmt(r.N[0], "N"))}</text>`);
      o.push(`<rect class="hit" x="0" y="${y0 - 4}" width="${w}" height="${bh * 2 + 10}"><title>${esc(groupName(view, r.group) + ": " + L().legReg + " " + fmt(r.registered, "N") + " · " + L().legEst + " " + fmt(r.N[0], "N") + " (" + ci(r.N, "N") + ")")}</title></rect>`);
    });
    o.push(`<line class="axis" x1="${ml}" x2="${ml}" y1="${mt}" y2="${h - mb}"/>`);
    o.push(`</svg>`); return o.join("");
  }

  /* model weights: labels above bars so long names fit on phones */
  function weightBars(w, items, label) {
    const rowH = 34, mt = 4, h = mt + rowH * items.length + 4, ml = 0, mr = 52, o = [];
    const hi = Math.max(...items.map((it) => it.v));
    const x = (v) => ml + (w - ml - mr) * v / hi;
    o.push(svgOpen(w, h, label));
    items.forEach((it, i) => {
      const y0 = mt + rowH * i;
      o.push(`<text class="nm" x="0" y="${y0 + 11}" style="font-size:11.5px">${esc(it.label)}</text>`);
      const x1 = Math.max(4, x(it.v)), yy = y0 + 15, bh = 12, rr = 3;
      o.push(`<path class="${it.other ? "nodata" : "bar1"}" d="M0,${yy}H${x1 - rr}Q${x1},${yy} ${x1},${yy + rr}V${yy + bh - rr}Q${x1},${yy + bh} ${x1 - rr},${yy + bh}H0Z"/>`);
      o.push(`<text class="lab" x="${x1 + 5}" y="${yy + 10}">${esc((it.v * 100).toLocaleString(loc(), { maximumFractionDigits: 1, minimumFractionDigits: 1 }) + " %")}</text>`);
      o.push(`<rect class="hit" x="0" y="${y0}" width="${w}" height="${rowH}"><title>${esc(it.label + ": " + (it.v * 100).toFixed(2) + " %")}</title></rect>`);
    });
    o.push(`</svg>`); return o.join("");
  }

  /* valley map: polygons only, no figures */
  function valleyMap() {
    const W = MAP.width, H = MAP.height, o = [];
    o.push(`<svg class="vz" viewBox="0 0 ${W} ${H + 40}" role="img" aria-label="${esc(L().cards.map[0] + " · " + L().mapNote)}">`);

    });

    // north arrow (top right)
    const nx = W - 28, ny = 18;
    o.push(`<g aria-hidden="true"><path class="north" d="M${nx},${ny}l9,26l-9,-6l-9,6z"/><text class="lab" x="${nx}" y="${ny + 42}" text-anchor="middle" style="font-family:var(--font-display);font-weight:700">N</text></g>`);
    // scale bar: 5 km

    o.push(`<text x="${sx}" y="${sy - 5}">0</text><text x="${sx + px}" y="${sy - 5}" text-anchor="middle">${km} km</text>`);
    o.push(`<text x="${W - 8}" y="${sy + 6}" text-anchor="end">MAGNA-SIRGAS</text></g>`);
    o.push(`</svg>`); return o.join("");
  }

  /* ---------- legends ---------- */
  const lg = {
    band: () => `<span><svg width="16" height="12"><rect x="0" y="1" width="16" height="10" fill="var(--chart-cat-1)" opacity=".18"/><line x1="0" x2="16" y1="6" y2="6" stroke="var(--chart-cat-1)" stroke-width="2"/></svg>${esc(L().legMed + " · " + L().legBand)}</span>`,
    dot: () => `<span><svg width="12" height="16"><line x1="6" x2="6" y1="1" y2="15" stroke="var(--chart-cat-1)" stroke-width="3"/><circle cx="6" cy="8" r="4.5" fill="var(--chart-cat-1)"/></svg>${esc(L().legMed + " · " + L().legBand)}</span>`,
    reg: () => `<span><svg width="12" height="12"><rect x="2" y="2" width="8" height="8" fill="none" stroke="var(--chart-cat-2)" stroke-width="2"/></svg>${esc(L().legReg)}</span>`,
    bar: () => `<span><svg width="20" height="12"><rect x="0" y="2" width="14" height="10" rx="2" fill="var(--chart-cat-1)"/><line x1="14" x2="14" y1="0" y2="12" stroke="var(--text)" stroke-width="1.5"/></svg>${esc(L().legMed + " · " + L().legBand)}</span>`,
    reg3: () => `<span><svg width="14" height="12"><rect x="0" y="1" width="14" height="10" rx="2" fill="var(--chart-cat-3)"/></svg>${esc(L().legReg)}</span>`,
    est1: () => `<span><svg width="14" height="12"><rect x="0" y="1" width="14" height="10" rx="2" fill="var(--chart-cat-1)"/></svg>${esc(L().legEst + " · " + L().legBand)}</span>`,
    supp: () => `<span><svg width="14" height="12"><rect x="0" y="1" width="14" height="10" fill="var(--chart-nodata)"/><rect x="0" y="1" width="14" height="10" fill="url(#hatch)"/></svg>${esc(tx(L().legSupp, { s: SUP }))}</span>`,
    w: () => `<span><svg width="14" height="12"><rect x="0" y="1" width="14" height="10" rx="2" fill="var(--chart-cat-1)"/></svg>${esc(L().cards.weights[0])}</span>`,
    pend: () => `<span><svg width="14" height="12"><rect x="0" y="1" width="14" height="10" fill="var(--chart-nodata)"/><rect x="0" y="1" width="14" height="10" fill="url(#hatch)"/></svg>${esc(L().mapNote)}</span>`
  };

  /* ---------- cards ---------- */
  const tableRows = (rows, view, metric) => ({ head: L().th, body: rows.map((r) => [groupName(view, r.group), r.suppressed ? supTxt() : fmt(r.registered, "N"), isSup(r, metric) ? supTxt() : fmt(r[metric][0], metric), isSup(r, metric) ? "—" : ci(r[metric], metric)]) });
  function weightItems() {
    const ms = D.models.filter((x) => x.id !== "bma").slice().sort((a, b) => b.weight - a.weight);
    const top = ms.slice(0, 10).map((m) => ({ label: m.name, v: m.weight, n: m.groups.all[0].N }));
    const rest = ms.slice(10);
    if (rest.length) top.push({ label: tx(L().other, { n: rest.length }), v: rest.reduce((s, m) => s + m.weight, 0), other: true });
    return top;
  }
  const G = () => byId[S.model].groups;
  const CARDS = [
    { id: "nYear", tags: ["core", "time"], icon: "timeline", legend: ["band", "reg", "supp"], draw: (w) => lineBand(w, G().year, "N", true, L().cards.nYear[0]), table: () => tableRows(G().year, "year", "N") },
    { id: "ageRE", tags: ["core", "age"], icon: "cohort", legend: ["reg3", "est1", "supp"], draw: (w) => pairedH(w, G().age_band, "age_band", L().cards.ageRE[0]), table: () => tableRows(G().age_band, "age_band", "N") },
    { id: "hiddenAge", tags: ["age"], icon: "lens", legend: ["bar", "supp"], draw: (w) => catV(w, G().age_band, "age_band", "hidden", "bar", false, L().cards.hiddenAge[0]), table: () => tableRows(G().age_band, "age_band", "hidden") },
    { id: "compAge", tags: ["core", "age"], icon: "check", legend: ["bar", "supp"], draw: (w) => catV(w, G().age_band, "age_band", "completeness", "bar", false, L().cards.compAge[0]), table: () => tableRows(G().age_band, "age_band", "completeness") },
    { id: "sexRE", tags: ["core", "sex"], icon: "partners", legend: ["reg3", "est1", "supp"], draw: (w) => pairedH(w, G().sex, "sex", L().cards.sexRE[0]), table: () => tableRows(G().sex, "sex", "N") },
    { id: "compSex", tags: ["sex"], icon: "check", legend: ["bar", "supp"], draw: (w) => catV(w, G().sex, "sex", "completeness", "bar", false, L().cards.compSex[0]), table: () => tableRows(G().sex, "sex", "completeness") },
    { id: "nPeriod", tags: ["time"], icon: "timeline", legend: ["dot", "reg", "supp"], draw: (w) => catV(w, G().period, "period", "N", "dot", true, L().cards.nPeriod[0]), table: () => tableRows(G().period, "period", "N") },
    { id: "compYear", tags: ["time"], icon: "timeline", legend: ["band", "supp"], draw: (w) => lineBand(w, G().year, "completeness", false, L().cards.compYear[0]), table: () => tableRows(G().year, "year", "completeness") },
    { id: "weights", tags: ["core"], icon: "analysis", legend: ["w"], draw: (w) => weightBars(w, weightItems(), L().cards.weights[0]), table: () => ({ head: L().wth, body: weightItems().map((it) => [it.label, (it.v * 100).toFixed(2) + " %", it.n ? fmt(it.n[0], "N") + " (" + ci(it.n, "N") + ")" : "—"]) }), bmaOnly: true },
    { id: "map", tags: ["map"], icon: "territory", legend: ["pend"], draw: () => valleyMap(), map: true }
  ];

  function cardShell(c) {
    const t = L(), [title, sub] = t.cards[c.id], open = !S.collapsed.has(c.id);
    return `<article class="card chart-card" data-id="${c.id}" aria-labelledby="h-${c.id}">
      <div class="card-h"><span class="ic">${ICON[c.icon] || ""}</span><div><h3 id="h-${c.id}">${esc(title)}</h3><p class="sub">${esc(sub)}</p></div>
      <button type="button" class="chev" aria-expanded="${open}" aria-controls="b-${c.id}" aria-label="${esc(open ? t.collapse : t.expand)}">${CHEV}</button></div>
      <div class="card-b" id="b-${c.id}"${open ? "" : " hidden"}></div></article>`;
  }
  function fillCard(c) {
    const el = document.querySelector(`.chart-card[data-id="${c.id}"] .card-b`);
    if (!el || el.hidden) return;
    const t = L(), m = byId[S.model];
    const cv = document.createElement("div"); cv.className = "canvas"; el.innerHTML = ""; el.appendChild(cv);
    const w = Math.max(260, Math.floor(cv.clientWidth || 520));
    const parts = [`<div class="legend">${c.legend.map((k) => lg[k]()).join("")}</div>`];
    if (c.map) {
      parts.push(`<div class="canvas"><div class="mapwrap">${c.draw()}</div></div>`);
      parts.push(`<p class="cap">${esc(t.mapCap)}</p><p class="src">${esc(t.mapSrc)}</p>`);
    } else {
      parts.push(`<div class="canvas">${c.draw(w)}</div>`);
      parts.push(`<p class="cap">${esc(t.cards[c.id][2] + " " + tx(t.cap, { s: SUP }))}</p>`);
      parts.push(`<p class="src">${esc(tx(t.src, { run: M.source_run, sha: String(M.run_git_sha || "").slice(0, 7), date: M.date, draws: (c.bmaOnly ? byId.bma : m).draws.toLocaleString(loc()) }))}</p>`);
      const on = S.tables.has(c.id);
      parts.push(`<button type="button" class="tbl-toggle" aria-expanded="${on}">${esc(on ? t.hideT : t.showT)}</button>`);
      if (on) { const tb = c.table(); parts.push(`<div class="tbl-wrap"><table><thead><tr>${tb.head.map((h, i) => `<th${i ? ' class="n"' : ""}>${esc(h)}</th>`).join("")}</tr></thead><tbody>${tb.body.map((r) => `<tr>${r.map((v, i) => `<td${i ? ' class="n' + (v === supTxt() ? " sup" : "") + '"' : ""}>${esc(v)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`); }
    }

  }
  function visibleCards() { return CARDS.filter((c) => S.tab === "all" || c.tags.includes(S.tab)); }
  function renderGrid() {
    const g = $("grid");

    g.setAttribute("aria-labelledby", "tab-" + S.tab);
    g.querySelectorAll(".chev").forEach((b) => b.addEventListener("click", () => {
      const id = b.closest(".chart-card").dataset.id;

      const open = !S.collapsed.has(id), body = $("b-" + id);
      b.setAttribute("aria-expanded", String(open)); b.setAttribute("aria-label", open ? L().collapse : L().expand); body.hidden = !open;
      if (open) fillCard(CARDS.find((c) => c.id === id));
    }));
    visibleCards().forEach(fillCard);
  }

  /* ---------- top cards ---------- */
  function renderTop() {
    const t = L(), m = byId[S.model], all = m.groups.all[0];
    const date = new Date(M.export + "T12:00:00").toLocaleDateString(loc(), { day: "numeric", month: "long", year: "numeric" });
    const periods = Object.keys(M.periods).map(winL).join(", ");
    const nMuni = MAP.municipalities.length;
    const rows = [
      [t.dRegion, t.dRegionV, tx(t.dRegionS, { n: nMuni })],

    const cell = (r, metric, withCi) => isSup(r, metric) ? `<td class="n sup">${esc(supTxt())}</td>` : `<td class="n">${esc(fmt(r[metric][0], metric))}${withCi ? ` <small>(${esc(ci(r[metric], metric))})</small>` : ""}</td>`;

    $("sumTable").innerHTML = `<table><thead><tr>${t.sth.map((h, i) => `<th${i ? ' class="n"' : ""}>${esc(h)}</th>`).join("")}</tr></thead><tbody>` +
      `<tr class="sec"><td colspan="5">${esc(t.secAge)}</td></tr>` + m.groups.age_band.map((r) => tr(r, "age_band")).join("") +
      `<tr class="sec"><td colspan="5">${esc(t.secSex)}</td></tr>` + m.groups.sex.map((r) => tr(r, "sex")).join("") +
      tr(all, null, "tot") + `</tbody></table>`;
    $("sumSub").textContent = tx(t.sumSub, { model: modelName(m) });
    $("sumPeriod").innerHTML = tx(t.period, { p: esc(winL(all.group)) });
  }

  function renderStatic() {
    const t = L();
    document.documentElement.lang = S.lang;
    document.title = t.docTitle;
    document.querySelectorAll("#langToggle button").forEach((b) => b.setAttribute("aria-current", String(b.dataset.lang === S.lang)));
    $("themeBtn").textContent = isDark() ? t.theme.dark : t.theme.light;
    $("bannerIcon").innerHTML = ICON.alert || "";
    $("bannerText").innerHTML = t.banner;
    $("heroLogoReverse").innerHTML = S.lang === "es" ? LOGO.reverse_es : LOGO.reverse;
    $("heroLogoPrimary").innerHTML = S.lang === "es" ? LOGO.primary_es : LOGO.primary;
    const date = new Date(M.export + "T12:00:00").toLocaleDateString(loc(), { day: "numeric", month: "long", year: "numeric" });
    const all = byId.bma.groups.all[0];
    $("heroEyebrow").textContent = tx(t.eyebrow, { date });
    $("heroTitle").textContent = t.title;
    $("heroLead").innerHTML = tx(t.lead, { win: winL(all.group), m: M.n_models });
    $("heroPrelim").innerHTML = (ICON.alert || "") + "<span>" + esc(tx(t.prelim, { k: M.stop.n_flagged, m: M.n_models })) + "</span>";
    const vals = [[fmt(all.N[0], "N"), tx(t.stats[0][1], { ci: ci(all.N, "N") })], [fmt(M.n_registered, "N"), t.stats[1][1]],
      [fmt(all.completeness[0], "completeness"), tx(t.stats[2][1], { ci: ci(all.completeness, "completeness") })]];
    $("heroStats").innerHTML = vals.map(([v, sub], i) => `<div class="stat"><span class="v">${esc(v)}</span><span class="l"><b>${esc(t.stats[i][0])}</b>${esc(sub)}</span></div>`).join("");
    $("detIc").innerHTML = ICON.studyDesign || ""; $("sumIc").innerHTML = ICON.analysis || "";
    $("detTitle").textContent = t.det; $("detSub").textContent = t.detSub; $("sumTitle").textContent = t.sum;
    $("detTag").textContent = t.tag; $("sumTag").textContent = t.tag;
    $("modelLbl").textContent = t.model;
    $("modelSel").innerHTML = D.models.map((m) => `<option value="${esc(m.id)}"${m.id === S.model ? " selected" : ""}>${esc(modelName(m))}${m.id === "bma" ? "" : " · " + (m.weight * 100).toFixed(1) + " %"}</option>`).join("");
    const tabs = ["all", "core", "age", "sex", "time", "map"];
    $("tabs").innerHTML = tabs.map((k) => `<button type="button" role="tab" id="tab-${k}" aria-selected="${k === S.tab}" tabindex="${k === S.tab ? 0 : -1}" data-tab="${k}">${esc(t.tabs[k])}</button>`).join("");
    $("tabs").querySelectorAll("button").forEach((b) => {
      b.addEventListener("click", () => { S.tab = b.dataset.tab; renderStatic(); $("tab-" + S.tab).focus(); });
      b.addEventListener("keydown", (e) => {
        const i = tabs.indexOf(b.dataset.tab), d = e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0;
        if (d) { e.preventDefault(); S.tab = tabs[(i + d + tabs.length) % tabs.length]; renderStatic(); $("tab-" + S.tab).focus(); }
      });
    });
    $("pageFooter").innerHTML = "<p>" + esc(tx(t.footer, { date: M.date, run: M.source_run, reason: tx(t.prelim, { k: M.stop.n_flagged, m: M.n_models }) })) + "</p>";
    renderTop(); renderGrid();
  }

  $("modelSel").addEventListener("change", (e) => { S.model = e.target.value; renderTop(); renderGrid(); });
  document.querySelectorAll("#langToggle button").forEach((b) => b.addEventListener("click", () => { S.lang = b.dataset.lang; store.set("stept1d-lang", S.lang); renderStatic(); }));
  let rz = null, lastW = window.innerWidth;
  window.addEventListener("resize", () => { if (window.innerWidth === lastW) return; lastW = window.innerWidth; clearTimeout(rz); rz = setTimeout(() => visibleCards().forEach(fillCard), 150); });
  renderStatic();
})();
</script>

</body>
</html>
