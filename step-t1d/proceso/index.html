<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta property="og:title" content="Mapa del proceso STEP-T1D">
<meta property="og:description" content="Cómo STEP-T1D convierte historias clínicas de doce instituciones en una estimación de la diabetes tipo 1 en el Valle de Aburrá. Cifras preliminares.">
<title>STEP-T1D process map</title>
<meta name="description" content="How STEP-T1D turns clinical charts from twelve institutions into an estimate of type 1 diabetes in the Valle de Aburrá.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: a light masthead, the thesis on surface-inverse, then one figure: a vertical, to-scale
   flow of records and people (lists at the top, each exclusion turning right into a labelled
   column, the three-list overlap inside the box of everyone at the bottom), with the detail panel
   beside it, and the steps still to come.
   Tokens copied from the STEP-T1D design system (tokens.css, version 1793527154-db53). */
:root {
  --brand-ink:#0c2340; --brand-blue:#3a70ab; --brand-lens:#6c99c7; --brand-drop:#c8382c;
  --surface:#ffffff; --surface-subtle:#f2f5f9; --surface-raised:#ffffff; --surface-wash:#f1f8ff; --surface-sunken:#e7ecf0; --surface-chart:#f8fafd;
  --surface-inverse:#0c2340; --text-inverse:#ffffff; --text-inverse-soft:#c9d8ea; --hero-rule:rgba(201,216,234,.28);
  --border-hairline:#e7ecf0; --border:#d6dbe1; --border-strong:#b8bec5; --border-control:#6e757d;
  --text:#0c2340; --text-secondary:#555c63; --text-muted:#6e757d; --text-link:#24588f;
  --accent:#3a70ab; --accent-hover:#24588f; --accent-quiet:#6c99c7; --on-accent:#ffffff; --focus-ring:#5283ba;
  --status-good:#0e664d; --status-warning:#8c5e0f; --status-warning-inverse:#f2c27a;
  --chart-cat-1:#3a70ab; --chart-cat-2:#c8382c; --chart-cat-3:#1d9fa0; --chart-grid:#e7ecf0; --chart-axis:#b8bec5;
  --flow-node:#0c2340; --flow-people:#6c99c7; --flow-out:#c4ccd5; --band-opacity:.5; --ribbon-opacity:.3; --ring-opacity:.13;
  --show-light:block; --show-dark:none;
  --shadow-sm:0 1px 2px rgba(12,35,64,.06),0 1px 1px rgba(12,35,64,.04);
  --shadow-md:0 2px 4px rgba(12,35,64,.06),0 8px 16px -6px rgba(12,35,64,.10);
  --shadow-lg:0 4px 8px rgba(12,35,64,.06),0 20px 40px -12px rgba(12,35,64,.16);
  --radius-xs:3px; --radius-sm:6px; --radius-md:10px; --radius-lg:16px;
  --font-display:Archivo,"Helvetica Neue",Helvetica,Arial,sans-serif;
  --font-text:"Source Serif 4",Georgia,"Times New Roman",serif;
  --font-data:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --surface:#0c1723; --surface-subtle:#172534; --surface-raised:#1a2838; --surface-wash:#1c2d3f; --surface-sunken:#060f19; --surface-chart:#0e1a26;
  --surface-inverse:#ffffff; --text-inverse:#0c2340; --text-inverse-soft:#3d4b5c; --hero-rule:rgba(61,75,92,.22);
  --border-hairline:#293747; --border:#38485a; --border-strong:#4d5f75; --border-control:#8894a1;
  --text:#e7eef5; --text-secondary:#aeb9c5; --text-muted:#8894a1; --text-link:#8dbbf0;
  --accent:#76a9e2; --accent-hover:#b0d5fe; --accent-quiet:#6c99c7; --on-accent:#0c2340; --focus-ring:#76afee;
  --status-good:#46b591; --status-warning:#eaa948; --status-warning-inverse:#8c5e0f;
  --chart-cat-1:#4b8fd9; --chart-cat-2:#de5c4d; --chart-cat-3:#1ea4a5; --chart-grid:#223246; --chart-axis:#4d5f75;
  --flow-node:#e7eef5; --flow-people:#6c99c7; --flow-out:#3a4a5c; --band-opacity:.62; --ribbon-opacity:.42; --ring-opacity:.18;
  --show-light:none; --show-dark:block;
  --shadow-sm:0 1px 2px rgba(0,0,0,.5); --shadow-md:0 2px 4px rgba(0,0,0,.4),0 8px 16px -6px rgba(0,0,0,.55); --shadow-lg:0 4px 8px rgba(0,0,0,.4),0 20px 40px -12px rgba(0,0,0,.6);
  color-scheme:dark; } }
:root[data-theme="dark"] {
  --surface:#0c1723; --surface-subtle:#172534; --surface-raised:#1a2838; --surface-wash:#1c2d3f; --surface-sunken:#060f19; --surface-chart:#0e1a26;
  --surface-inverse:#ffffff; --text-inverse:#0c2340; --text-inverse-soft:#3d4b5c; --hero-rule:rgba(61,75,92,.22);
  --border-hairline:#293747; --border:#38485a; --border-strong:#4d5f75; --border-control:#8894a1;
  --text:#e7eef5; --text-secondary:#aeb9c5; --text-muted:#8894a1; --text-link:#8dbbf0;
  --accent:#76a9e2; --accent-hover:#b0d5fe; --accent-quiet:#6c99c7; --on-accent:#0c2340; --focus-ring:#76afee;
  --status-good:#46b591; --status-warning:#eaa948; --status-warning-inverse:#8c5e0f;
  --chart-cat-1:#4b8fd9; --chart-cat-2:#de5c4d; --chart-cat-3:#1ea4a5; --chart-grid:#223246; --chart-axis:#4d5f75;
  --flow-node:#e7eef5; --flow-people:#6c99c7; --flow-out:#3a4a5c; --band-opacity:.62; --ribbon-opacity:.42; --ring-opacity:.18;
  --show-light:none; --show-dark:block;
  --shadow-sm:0 1px 2px rgba(0,0,0,.5); --shadow-md:0 2px 4px rgba(0,0,0,.4),0 8px 16px -6px rgba(0,0,0,.55); --shadow-lg:0 4px 8px rgba(0,0,0,.4),0 20px 40px -12px rgba(0,0,0,.6);
  color-scheme:dark; }

*,*::before,*::after { box-sizing:border-box; }
[hidden] { display:none!important; }
body { margin:0; background:var(--surface); color:var(--text); font-family:var(--font-display); -webkit-font-smoothing:antialiased; }
h1,h2,h3,p,ol,ul { margin:0; }
ol,ul { padding:0; list-style:none; }
button { font:inherit; color:inherit; }
.wrap { max-width:1200px; margin:0 auto; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); }
:focus-visible { outline:2px solid var(--focus-ring); outline-offset:2px; }
@media (prefers-reduced-motion: reduce) { *,*::before,*::after { transition:none!important; animation:none!important; scroll-behavior:auto!important; } }
.logo-light { display:var(--show-light); } .logo-dark { display:var(--show-dark); }
.logo-light svg, .logo-dark svg { display:block; height:auto; }

/* masthead */
.mast { background:var(--surface); border-bottom:1px solid var(--border-hairline); }
.mast .wrap { display:flex; align-items:center; justify-content:flex-end; gap:16px; padding-block:12px; min-height:60px; }
.lang { display:inline-flex; gap:2px; padding:2px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--surface); }
.lang button { background:transparent; border:0; border-radius:4px; padding:6px 12px; font-size:13px; line-height:18px; font-weight:600; letter-spacing:.04em; color:var(--text-link); cursor:pointer; }
.lang button[aria-current="true"] { background:var(--accent); color:var(--on-accent); }

/* hero */
.hero { background:var(--surface-inverse); color:var(--text-inverse); }
.hero .wrap { padding-block:48px 56px; display:grid; gap:32px; }
.hero-logo svg { width:230px; }
.hero-grid { display:grid; grid-template-columns:minmax(0, 7fr) minmax(0, 5fr); gap:48px; align-items:end; }
.ticks { display:flex; align-items:flex-end; height:10px; }
.ticks i { display:block; width:1px; height:4px; background:var(--brand-lens); margin-right:15px; }
.ticks i:nth-child(5n+1) { height:9px; background:var(--text-inverse-soft); }
.eyebrow { font-size:12px; line-height:16px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; }
.hero .eyebrow { color:var(--text-inverse-soft); margin-top:12px; }
.hero h1 { font-size:clamp(34px, 5vw, 56px); line-height:1.04; font-weight:700; letter-spacing:-.025em; text-wrap:balance; margin-top:12px; }
.hero .lead { font-family:var(--font-text); font-size:18px; line-height:30px; color:var(--text-inverse-soft); max-width:62ch; margin-top:20px; }
.hero .lead strong { color:var(--text-inverse); font-weight:600; }
.prelim { display:inline-flex; align-items:flex-start; gap:8px; font-size:13px; line-height:18px; font-weight:500; margin-top:20px; color:var(--status-warning-inverse); }
.prelim svg { width:15px; height:15px; flex:none; margin-top:1px; }
.stats { display:grid; grid-template-columns:auto minmax(0, 1fr); column-gap:20px; }
.stat { display:grid; grid-column:1 / -1; grid-template-columns:subgrid; align-items:baseline; padding-block:16px; border-top:1px solid var(--hero-rule); }
.stat:first-child { border-top:0; padding-top:0; }
.stat .v { font-size:44px; line-height:1; font-weight:700; letter-spacing:-.03em; text-align:right; white-space:nowrap; }
.stat .l { font-size:15px; line-height:20px; font-weight:500; color:var(--text-inverse-soft); }
.stat .l b { display:block; color:var(--text-inverse); font-weight:600; }

/* figure */
.figsec { padding-block:48px 32px; }
.fig { background:var(--surface-chart); border:1px solid var(--border); border-radius:var(--radius-lg); padding:24px; display:grid; gap:16px; }
/* AA on the chart surface: muted ink (#6e757d) on #f8fafd is 4.45:1, so inside the figure card it steps up to secondary ink. */
.fig { --text-muted: var(--text-secondary); }
.fig-top { display:flex; flex-wrap:wrap; align-items:center; gap:8px 16px; }
.fnum { font-size:12px; line-height:16px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--text-muted); }
.fig h2 { font-size:clamp(20px, 2.2vw, 26px); line-height:1.25; font-weight:600; letter-spacing:-.01em; text-wrap:balance; max-width:36ch; }
.controls { display:flex; flex-wrap:wrap; gap:16px 32px; align-items:flex-start; }
.ctl { display:grid; gap:8px; min-width:0; }
.ctl .lbl { font-size:12px; line-height:16px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--text-muted); }
.seg { display:flex; flex-wrap:wrap; gap:4px; }
.seg label { position:relative; display:inline-flex; }
.seg input { position:absolute; inset:0; width:100%; height:100%; opacity:0; margin:0; cursor:pointer; }
.seg span { padding:7px 12px; border:1px solid var(--border); border-radius:var(--radius-sm); font-size:13px; line-height:18px; font-weight:500; color:var(--text-secondary); background:var(--surface); transition:background-color .15s ease, color .15s ease; }
.seg label:hover span { border-color:var(--border-strong); color:var(--text); }
.seg input:checked + span { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
.seg input:focus-visible + span { outline:2px solid var(--focus-ring); outline-offset:2px; }
.delta { font-family:var(--font-data); font-size:12px; line-height:17px; color:var(--text-secondary); min-height:17px; }
.legend { display:flex; flex-wrap:wrap; gap:8px 20px; align-items:center; }
.legend span { display:inline-flex; align-items:center; gap:8px; font-size:13px; line-height:18px; font-weight:500; color:var(--text-secondary); }
.legend i { width:12px; height:12px; border-radius:2px; flex:none; }
.legend svg { display:block; }
.fig-body { display:grid; grid-template-columns:minmax(0, 1fr); gap:24px; align-items:start; }
.canvas { position:relative; min-width:0; }
.canvas svg.vz { display:block; width:100%; height:auto; overflow:visible; }
.cap { font-size:13px; line-height:19px; color:var(--text-secondary); max-width:92ch; }
.src { font-family:var(--font-data); font-size:12px; line-height:17px; color:var(--text-muted); }
.tbl-toggle { justify-self:start; background:transparent; border:0; padding:0; color:var(--text-link); font-size:14px; font-weight:500; cursor:pointer; text-decoration:underline; text-underline-offset:3px; }
.tables { display:grid; gap:20px; }
.fig > *, .tables > * { min-width:0; } /* a wide table scrolls inside its own box instead of widening the card */
.tbl-wrap { overflow-x:auto; }
.tables h3 { font-size:14px; line-height:20px; font-weight:600; margin-bottom:6px; }
table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
th, td { text-align:left; padding:6px 10px; vertical-align:top; }
thead th { background:var(--surface-subtle); font-size:12px; font-weight:600; color:var(--text-secondary); border-bottom:1px solid var(--border); }
td { font-family:var(--font-data); font-size:12.5px; border-bottom:1px solid var(--border-hairline); }
td:first-child { font-family:var(--font-display); font-weight:500; font-size:13px; }
th.n, td.n { text-align:right; }

/* the drawing */
.vz text { font-family:var(--font-display); }
.vz .t-name { fill:var(--text); font-weight:600; }
.vz .t-count { font-family:var(--font-data); fill:var(--text-muted); }
.vz .t-node { fill:var(--surface-chart); font-weight:600; }
.vz .r-num { fill:var(--text); font-weight:700; font-variant-numeric:tabular-nums; }
.vz .r-txt { fill:var(--text-secondary); font-weight:500; }
.vz .r-note { font-family:var(--font-data); fill:var(--text-muted); }
.vz .lead { stroke:var(--border-strong); stroke-width:1; stroke-dasharray:1 3; fill:none; }
.vz .clean { stroke:var(--border-control); stroke-width:1.25; stroke-dasharray:4 4; fill:none; }
.vz .universe { fill:transparent; stroke:var(--border-control); stroke-width:1.25; stroke-dasharray:5 5; }
.vz .ring { stroke-width:2; fill-opacity:var(--ring-opacity); }
.vz .v-cnt { fill:var(--text); font-weight:700; font-variant-numeric:tabular-nums; }
.vz .hit { fill:transparent; }
.vz [data-id] { cursor:pointer; }
.vz .grp { transition:opacity .2s ease; }
.vz.dim .grp:not(.on) { opacity:.2; }
.vz .node:focus, .vz .rail:focus { outline:none; }
.vz .rail:focus-visible .hit { stroke:var(--focus-ring); stroke-width:2; }
.vz .node:focus-visible rect { stroke:var(--focus-ring); stroke-width:2; }
.vz .node:focus-visible .ring { stroke:var(--focus-ring); stroke-width:3; }
.vz .rail:hover .r-txt { fill:var(--text); }
.tip { position:absolute; pointer-events:none; background:var(--surface-raised); border:1px solid var(--border); border-radius:var(--radius-sm); box-shadow:var(--shadow-md); padding:8px 12px; font-size:13px; line-height:18px; color:var(--text); max-width:260px; z-index:5; }
.tip b { display:block; font-weight:600; }
.tip span { display:block; font-family:var(--font-data); font-size:12px; color:var(--text-secondary); margin-top:2px; }

/* detail panel */
.panel { min-width:0; display:grid; gap:16px; align-content:start; border-top:1px solid var(--border-hairline); padding-top:20px; }
.p-head { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
.kicker { font-family:var(--font-data); font-size:12px; line-height:17px; color:var(--text-muted); }
.panel h3 { font-size:21px; line-height:27px; font-weight:600; letter-spacing:-.01em; text-wrap:balance; }
.big { font-size:38px; line-height:40px; font-weight:700; letter-spacing:-.03em; }
.big small { font-family:var(--font-data); font-size:13px; font-weight:500; letter-spacing:0; color:var(--text-secondary); margin-left:8px; }
.prose { font-family:var(--font-text); font-size:16px; line-height:26px; color:var(--text); display:grid; gap:10px; max-width:62ch; }
.plain-label { font-family:var(--font-display); font-size:12px; line-height:16px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); }
.tech { border-top:1px solid var(--border-hairline); padding-top:10px; }
.tech summary { font-family:var(--font-display); font-size:12px; line-height:16px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); cursor:pointer; list-style:none; display:flex; align-items:center; gap:8px; }
.tech summary::-webkit-details-marker { display:none; }
.tech summary::before { content:"+"; font-family:var(--font-data); font-size:15px; width:12px; }
.tech[open] summary::before { content:"\2013"; }
.tech p { font-size:14px; line-height:23px; color:var(--text-secondary); margin-top:8px; }
.howto { list-style:decimal; padding-left:1.25em; display:grid; gap:8px; font-family:var(--font-text); font-size:16px; line-height:25px; }
.chips { display:flex; flex-wrap:wrap; gap:8px; }
.chip { display:inline-flex; align-items:center; gap:8px; padding:5px 10px; border:1px solid var(--border); border-radius:var(--radius-sm); font-size:13px; line-height:18px; font-weight:500; background:var(--surface); }
.chip i { width:10px; height:10px; border-radius:2px; flex:none; }
.chip b { font-variant-numeric:tabular-nums; }
.mini { display:grid; gap:4px; }
.mini .row { display:grid; grid-template-columns:minmax(0, 1fr) auto; gap:12px; font-size:14px; line-height:19px; align-items:center; width:100%; background:transparent; border:0; padding:4px 0 2px; text-align:left; cursor:pointer; }
.mini .row .n { font-family:var(--font-data); font-size:12px; color:var(--text-secondary); font-variant-numeric:tabular-nums; }
.mini .row:hover span:first-child, .mini .row[aria-current="true"] span:first-child { color:var(--text-link); text-decoration:underline; text-underline-offset:3px; }
.mini .bar { height:6px; border-radius:var(--radius-xs); background:var(--chart-grid); overflow:hidden; }
.mini .bar i { display:block; height:100%; }
.sub { font-size:13px; line-height:18px; font-weight:600; color:var(--text-secondary); margin-top:4px; }
.tags { display:flex; flex-wrap:wrap; gap:4px; }
.tag { font-family:var(--font-data); font-size:12px; line-height:17px; padding:2px 8px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--surface); color:var(--text-secondary); }
.bars6 { display:grid; grid-template-columns:repeat(6, minmax(0, 1fr)); gap:6px; align-items:end; height:110px; }
.bars6 .cb { display:grid; grid-template-rows:auto 1fr; gap:4px; height:100%; align-items:end; text-align:center; }
.bars6 .v { font-family:var(--font-data); font-size:12px; }
.bars6 .b { display:block; background:var(--flow-people); border-radius:var(--radius-xs) var(--radius-xs) 0 0; min-height:2px; }
.bars6-x { display:grid; grid-template-columns:repeat(6, minmax(0, 1fr)); gap:6px; text-align:center; font-family:var(--font-data); font-size:12px; color:var(--text-muted); border-top:1px solid var(--chart-axis); padding-top:4px; }
.steps { display:grid; gap:2px; }
.steps button { display:grid; grid-template-columns:3.6em minmax(0, 1fr); gap:10px; align-items:baseline; background:transparent; border:0; border-bottom:1px solid var(--border-hairline); padding:7px 0; text-align:left; cursor:pointer; font-size:14px; line-height:19px; }
.steps button b { text-align:right; font-variant-numeric:tabular-nums; }
.steps button:hover span { color:var(--text-link); text-decoration:underline; text-underline-offset:3px; }
.steps button.zero { color:var(--text-muted); }
.status { display:inline-flex; align-items:center; gap:6px; font-size:13px; line-height:18px; font-weight:500; }
.status svg { width:15px; height:15px; flex:none; }
.status.done { color:var(--status-good); } .status.sign, .status.review { color:var(--status-warning); } .status.soon { color:var(--text-muted); }
.close { display:none; flex:none; width:32px; height:32px; align-items:center; justify-content:center; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--surface); font-size:20px; line-height:1; cursor:pointer; color:var(--text-secondary); }
@media (min-width: 960px) {
  .fig-body { grid-template-columns:minmax(0, 1fr) minmax(300px, 340px); gap:32px; }
  .panel { border-top:0; padding-top:0; border-left:1px solid var(--border-hairline); padding-left:28px; position:sticky; top:calc(16px + env(safe-area-inset-top, 0px)); max-height:calc(100vh - 32px); overflow-y:auto; }
}
@media (max-width: 959.98px) {
  .panel.sheet { position:fixed; left:0; right:0; bottom:0; z-index:30; max-height:60vh; overflow-y:auto; background:var(--surface-raised); border:1px solid var(--border); border-bottom:0; border-radius:var(--radius-lg) var(--radius-lg) 0 0; box-shadow:var(--shadow-lg);
    padding:16px max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .panel.sheet .close { display:inline-flex; }
}

/* what comes next */
.next { padding-block:32px 64px; display:grid; gap:24px; }
.next-head { display:grid; gap:8px; }
.next-head .ticks i { background:var(--brand-lens); } .next-head .ticks i:nth-child(5n+1) { background:var(--border-strong); }
.next-head .eyebrow { color:var(--accent); }
.next-head h2 { font-size:28px; line-height:34px; font-weight:600; letter-spacing:-.015em; text-wrap:balance; }
.next-grid { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:24px; }
.card { border:1px solid var(--border); border-radius:var(--radius-lg); background:var(--surface-raised); padding:24px; display:grid; gap:16px; align-content:start; min-width:0; }
.card .top { display:flex; justify-content:space-between; gap:12px; align-items:center; }
.card .ico { width:40px; height:40px; border-radius:var(--radius-md); background:var(--surface-wash); color:var(--accent); display:grid; place-items:center; }
.card .ico svg { width:22px; height:22px; }
.card h3 { font-size:19px; line-height:26px; font-weight:600; }
.card .body { font-family:var(--font-text); font-size:16px; line-height:26px; }
.card .note { font-size:13px; line-height:19px; color:var(--text-secondary); }
.mgrid { display:grid; grid-template-columns:auto repeat(var(--cols), minmax(0, 1fr)); gap:4px; align-items:center; }
.mgrid .rh { font-size:12px; line-height:15px; color:var(--text-secondary); padding-right:8px; }
.mgrid .ch { font-family:var(--font-data); font-size:11px; color:var(--text-muted); text-align:center; }
.mgrid .m { aspect-ratio:1; max-width:100%; border-radius:var(--radius-xs); background:var(--surface-wash); border:1px solid var(--accent-quiet); transition:background-color .15s ease; }
.mgrid .m:hover, .mgrid .m:focus-visible { background:var(--accent); }
.mtip { font-family:var(--font-data); font-size:12px; line-height:17px; color:var(--text-secondary); min-height:34px; }
.munis { display:grid; gap:12px; }
.munis .mt { display:flex; align-items:flex-end; height:12px; }
.munis .mt i { flex:1; height:6px; border-left:1px solid var(--brand-lens); }
.munis .mt i:nth-child(5n+1) { height:12px; border-left-color:var(--border-strong); }
.munis ul { display:grid; grid-template-columns:repeat(5, minmax(0, 1fr)); gap:6px 16px; font-size:13px; line-height:18px; color:var(--text-secondary); }
footer.page { border-top:1px solid var(--border); padding-block:32px; color:var(--text-muted); font-size:13px; line-height:19px; }
footer.page p { max-width:92ch; }

@media (max-width: 900px) {
  .hero-grid, .next-grid { grid-template-columns:minmax(0, 1fr); }
  .stat .v { font-size:36px; }
  .munis ul { grid-template-columns:repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 520px) {
  .fig { padding:16px; }
  .hero .wrap { padding-block:32px 40px; }
  .hero-logo svg { width:196px; }
  .card { padding:18px; }
}

    TIPS.link = [L_.linkNode, `${nf(recIn)} ${L_.records} → ${nf(linked)} ${L_.people}`];
    let sLink = `<path class="node" data-id="link" d="M${x0},${f1(yLink0)}L${f1(x0 + recIn * k)},${f1(yLink0)}L${f1(x0 + linked * k)},${f1(yLink1)}L${x0},${f1(yLink1)}Z" fill="var(--flow-node)"/>`;
    if (linked * k >= 110) sLink += `<text class="t-node" x="${f1(x0 + linked * k / 2)}" y="${f1(bLink.anchor + 4.5)}" font-size="12.5" text-anchor="middle" pointer-events="none">${esc(L_.linkNode)}</text>`;
    sLink += leader(x0 + (recIn + linked) * k / 2 + 6, bLink.anchor) + railSvg(bLink, "link");
    groups.push({ group: "link", svg: sLink });

    // 2. the exclusions, top to bottom
    let prevBot = yLink1 - 4; let rem = linked; const ex = [];
    for (const st of exits) {
      const t = Math.max(st.excluded * k, minT);
      const label = tx(L_.step[st.key], { win: winL(S.win) });
      const b = place(block({ num: nf(st.excluded), text: label }), Math.max(prevBot + 10 + t / 2, yLink1 + 14 + r + t / 2));
      const u = b.anchor - r - t / 2;
      ex.push({ st, t, u, b, before: rem, label });
      rem = st.remaining; prevBot = u + r + t;
    }
    const cohH = narrow ? 8 : 10;
    const lastU = ex.length ? ex[ex.length - 1].u : yLink1;
    const bCoh = place(block({ num: nf(cohort), text: tx(L_.rail.cohort, { win: winL(S.win) }) }), Math.max(prevBot + 18, lastU + 30) + cohH / 2);
    const yCoh0 = bCoh.anchor - cohH / 2, yCoh1 = yCoh0 + cohH;

    // the people: one shape, its right edge stepping in where each exclusion leaves
    let d = `M${x0},${f1(yLink1)}L${f1(x0 + linked * k)},${f1(yLink1)}`;
    for (const e of ex) d += `L${f1(x0 + e.before * k)},${f1(e.u)}L${f1(x0 + e.st.remaining * k)},${f1(e.u)}`;
    d += `L${f1(x0 + cohort * k)},${f1(yCoh0)}L${x0},${f1(yCoh0)}Z`;
    let sTrunk = `<path class="band" data-id="trunk" d="${d}" fill="var(--flow-people)" style="fill-opacity:var(--band-opacity)"/>`;
    const bounds = [yLink1, ...ex.map((e) => e.u), yCoh0];
    const remBy = [f[0], ...ex.map((e) => e.st)];
    for (let j = 0; j < bounds.length - 1; j++) {
      const st = remBy[j]; const id = `seg:${j}`;
      sTrunk += `<rect class="hit" data-id="${id}" x="${x0}" y="${f1(bounds[j])}" width="${f1(Math.max(st.remaining * k, 8))}" height="${f1(Math.max(bounds[j + 1] - bounds[j], 1))}"/>`;
      TIPS[id] = [L_.remain, `${nf(st.remaining)} ${L_.people} · A ${nf(st.remaining_by_list.A)} · B ${nf(st.remaining_by_list.B)} · C ${nf(st.remaining_by_list.C)}`];
    }
    groups.push({ group: "criteria", svg: sTrunk });
    const endX = railX - 6;
    for (const e of ex) {
      const { t, u } = e; const bx = x0 + e.before * k, ax = bx - t; const kr = 0.5523 * r, kR = 0.5523 * (r + t);
      const id = `exit:${e.st.key}`;
      const pd = `M${f1(ax)},${f1(u)}L${f1(bx)},${f1(u)}C${f1(bx)},${f1(u + kr)} ${f1(bx + r - kr)},${f1(u + r)} ${f1(bx + r)},${f1(u + r)}L${f1(endX)},${f1(u + r)}L${f1(endX)},${f1(u + r + t)}L${f1(bx + r)},${f1(u + r + t)}C${f1(bx + r - kR)},${f1(u + r + t)} ${f1(ax)},${f1(u + kR)} ${f1(ax)},${f1(u)}Z`;
      const hh = Math.max(24, t);
      TIPS[id] = [e.label, `${nf(e.st.excluded)} ${L_.out} · A ${nf(e.st.excluded_by_list.A)} · B ${nf(e.st.excluded_by_list.B)} · C ${nf(e.st.excluded_by_list.C)}`];
      groups.push({ group: `step:${e.st.key}`, svg: `<rect class="hit" data-id="${id}" x="${f1(bx)}" y="${f1(u + r + t / 2 - hh / 2)}" width="${f1(endX - bx + 4)}" height="${f1(hh)}"/><path class="band" data-id="${id}" d="${pd}" fill="var(--flow-out)"/><rect x="${f1(endX)}" y="${f1(u + r)}" width="4" height="${f1(t)}" fill="var(--border-control)" pointer-events="none"/>` + railSvg(e.b, `step:${e.st.key}`) });
    }

    // 3. everyone, the lists inside, and the cell nobody saw
    const R = narrow ? Math.max(30, Math.min(40, (railX - x0 - 32) / 3.1)) : 56;
    const boxTop = Math.max(yCoh1 + 34, cursor + 12);
    const vy = boxTop + 16 + 1.32 * R, vx = x0 + 14 + 1.55 * R;
    const bHid = place(block({ num: "?", numSize: 24, text: L_.rail.hidden }), vy + 0.55 * R);
    const boxBot = Math.max(vy + 1.62 * R + 16, bHid.top + bHid.h + 12);
    TIPS.box = [L_.hiddenTitle, L_.tbd];
    groups.push({ group: "hidden", svg: `<rect class="universe" data-id="box" x="${x0}" y="${f1(boxTop)}" width="${f1(W - x0 - 2)}" height="${f1(boxBot - boxTop)}" rx="10"/>` + railSvg(bHid, "hidden") });
    TIPS.cohort = [L_.cohortTitle, `${nf(cohort)} ${L_.people} · ${winL(S.win)}`];
    const c = cohort * k;
    groups.push({ group: "cohort", svg: `<path class="band" data-id="cohort" d="${ribbonV(x0, x0 + c, yCoh1, vx - c / 2, vx + c / 2, vy - 1.2 * R)}" fill="var(--accent)" style="fill-opacity:var(--ribbon-opacity)"/><rect data-id="cohort" x="${x0}" y="${f1(yCoh0)}" width="${f1(Math.max(c, 2))}" height="${cohH}" fill="var(--accent)"/>` + leader(x0 + c + 6, bCoh.anchor) + railSvg(bCoh, "cohort") });
    const cen = { A: [vx - 0.55 * R, vy - 0.32 * R], B: [vx + 0.55 * R, vy - 0.32 * R], C: [vx, vy + 0.62 * R] };
    const pos = { A: [vx - 0.97 * R, vy - 0.44 * R], B: [vx + 0.97 * R, vy - 0.44 * R], C: [vx, vy + 1.07 * R], AB: [vx, vy - 0.6 * R], AC: [vx - 0.5 * R, vy + 0.28 * R], BC: [vx + 0.5 * R, vy + 0.28 * R], ABC: [vx, vy + 0.05 * R] };
    const letters = { A: [vx - 1.36 * R, vy - 1.08 * R], B: [vx + 1.36 * R, vy - 1.08 * R], C: [vx + 0.92 * R, vy + 1.5 * R] };
    let sV = `<g class="node" data-id="venn" tabindex="0" role="button" aria-label="${esc(L_.vennTitle)}">`;
    for (const id of ["A", "B", "C"]) {
      const on = h[id] + h.ABC + (id === "A" ? h.AB + h.AC : id === "B" ? h.AB + h.BC : h.AC + h.BC);
      TIPS[`circle:${id}`] = [`${L_.listShort[id]} · ${L_.lists[id]}`, tx(L_.onList, { n: nf(on) })];
      sV += `<circle class="ring" data-id="circle:${id}" cx="${f1(cen[id][0])}" cy="${f1(cen[id][1])}" r="${f1(R)}" fill="${LC[id]}" stroke="${LC[id]}"/>`;
    }
    sV += "</g>"; // the button holds only the circles; its counts and letters are drawn on top, outside it (WCAG 2.5.3)
    for (const key of REGIONS) {
      TIPS[`region:${key}`] = [L_.region[key], `${nf(h[key])} ${L_.people}`];
      sV += `<text class="v-cnt" data-id="region:${key}" aria-hidden="true" x="${f1(pos[key][0])}" y="${f1(pos[key][1] + 4.5)}" font-size="${narrow ? 12 : 14}" text-anchor="middle">${nf(h[key])}</text>`;
    }
    for (const id of ["A", "B", "C"]) sV += `<text class="t-name" aria-hidden="true" x="${f1(letters[id][0])}" y="${f1(letters[id][1] + 4)}" font-size="13" text-anchor="middle" pointer-events="none">${id}</text>`;
    groups.push({ group: "venn", svg: sV });
    return { W, H: Math.ceil(boxBot + 4), k, groups, TIPS };
  }

  /* ------------------------------------------------------------- rendering */
  let lastD = new Map(); let TIPS = {};
  const NUM = /-?\d+(?:\.\d+)?/g;
  function tween(el, from, to) {
    const a = from.match(NUM), b = to.match(NUM);
    if (!a || !b || a.length !== b.length || mq("(prefers-reduced-motion: reduce)") || !window.requestAnimationFrame) return;
    const t0 = performance.now(), dur = 420;
    const frame = (now) => {
      const t = Math.min(1, (now - t0) / dur), e = t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; let i = 0;
      el.setAttribute("d", to.replace(NUM, () => { const v = (+a[i]) + ((+b[i]) - (+a[i])) * e; i++; return v.toFixed(1); }));
      if (t < 1) requestAnimationFrame(frame);
    };
    el.setAttribute("d", from); requestAnimationFrame(frame);
  }
  function drawCanvas(animate) {
    const canvas = document.getElementById("canvas");
    const W = Math.max(300, Math.round(canvas.clientWidth || 720));
    const G = layout(W); TIPS = G.TIPS;
    canvas.innerHTML = `<svg class="vz" width="${G.W}" height="${G.H}" viewBox="0 0 ${G.W} ${G.H}" role="group" aria-labelledby="figTitle">${G.groups.map((g) => `<g class="grp" data-group="${g.group}">${g.svg}</g>`).join("")}</svg><div class="tip" id="tip" hidden></div>`;
    const paths = [...canvas.querySelectorAll("path[data-id]")];
    if (animate) paths.forEach((el) => { const prev = lastD.get(el.dataset.id); const now = el.getAttribute("d"); if (prev && prev !== now) tween(el, prev, now); });
    lastD = new Map(paths.map((el) => [el.dataset.id, el.getAttribute("d")]));
    const px = 500 * G.k;
    const key = document.getElementById("scaleKey");
    if (key) key.innerHTML = `<svg width="${Math.ceil(px) + 2}" height="12" aria-hidden="true"><rect x="1" y="3" width="${f1(px)}" height="6" fill="var(--flow-people)" style="fill-opacity:var(--band-opacity)"/></svg>${esc(tx(L().legend.scale, { n: nf(500) }))}`;
    applySelection();
  }
  function groupOf(id) {
    if (!id) return null;
    if (id.startsWith("inst:") || id.startsWith("rib:")) return "list:" + id.split(":")[1];
    if (id.startsWith("seg:") || id === "trunk") return "criteria";
    if (id.startsWith("exit:")) return "step:" + id.split(":")[1];
    if (id.startsWith("region:") || id.startsWith("circle:")) return "venn";

  }
  function applySelection() {
    const svg = document.querySelector("#canvas svg"); if (!svg) return;
    const g = groupOf(S.sel);
    const lit = new Set(g ? [g] : []);
    if (g === "lists") ["list:A", "list:B", "list:C"].forEach((x) => lit.add(x));
    if (g && g.startsWith("list:")) lit.add("lists");
    if (g && g.startsWith("step:")) lit.add("criteria");
    svg.classList.toggle("dim", !!g);
    svg.querySelectorAll(".grp").forEach((el) => el.classList.toggle("on", lit.has(el.dataset.group)));
  }

  /* ---------------------------------------------------------------- figure */
  function figureHead() {
    const L_ = L(); const f = flow(); const cohort = f[f.length - 1].remaining;
    const mainCohort = C.flows.main[S.win][C.flows.main[S.win].length - 1].remaining; const d = cohort - mainCohort;
    const recIn = S.rule === "S5" ? C.records.export : C.records.linked;
    document.getElementById("figNum").textContent = L_.fig;
    document.getElementById("figStatus").innerHTML = statusHtml("sign").replace(esc(L_.status.sign), esc(L_.prelimTag));
    document.getElementById("figTitle").textContent = tx(L_.figTitle, { records: nf(recIn), cohort: nf(cohort), win: winL(S.win) });
    document.getElementById("controls").innerHTML = `
      <div class="ctl" role="radiogroup" aria-labelledby="lblWin"><span class="lbl" id="lblWin">${esc(L_.win)}</span><div class="seg">${Object.keys(C.windows).map((w) => `<label><input type="radio" name="win" id="win-${w}" value="${w}" ${S.win === w ? "checked" : ""}><span>${esc(winL(w))} · ${esc(L_.windows[C.windows[w]])}</span></label>`).join("")}</div></div>
      <div class="ctl" role="radiogroup" aria-labelledby="lblRule"><span class="lbl" id="lblRule">${esc(L_.rule)}</span><div class="seg">${["main", "S5", "S6", "S16"].map((r) => `<label><input type="radio" name="rule" id="rule-${r}" value="${r}" ${S.rule === r ? "checked" : ""}><span>${esc(tx(L_.rules[r], { n: C.records.excluded_not_approved }))}</span></label>`).join("")}</div>
        <span class="delta">${S.rule === "main" ? "" : esc(d === 0 ? tx(L_.deltaZero, { n: nf(cohort) }) : tx(L_.delta, { n: nf(cohort), d: sf(d) }))}</span></div>`;
    document.getElementById("legend").innerHTML = ["A", "B", "C"].map((id) => `<span><i style="background:${LC[id]}"></i>${esc(L_.listShort[id])} · ${esc(L_.lists[id])}</span>`).join("")
      + `<span><i style="background:var(--flow-people)"></i>${esc(L_.legend.people)}</span><span><i style="background:var(--flow-out)"></i>${esc(L_.legend.out)}</span><span id="scaleKey"></span>`;
    document.getElementById("figCap").textContent = L_.figCap;

  }

  /* ----------------------------------------------------------------- panel */
  const proseHtml = (paras, tech) => `<div class="prose"><p class="plain-label">${esc(L().plain)}</p>${paras.map((p) => `<p>${esc(p)}</p>`).join("")}${tech ? `<details class="tech"><summary>${esc(L().tech)}</summary><p>${esc(tech)}</p></details>` : ""}</div>`;
  const chipsByList = (by) => `<div class="chips">${["A", "B", "C"].map((id) => `<span class="chip"><i style="background:${LC[id]}"></i>${esc(L().listShort[id])} <b>${nf(by[id])}</b></span>`).join("")}</div>`;
  const head = (kicker) => `<div class="p-head"><p class="kicker">${esc(kicker)}</p>${S.sel ? `<button type="button" class="close" data-close aria-label="${esc(L().close)}">×</button>` : ""}</div>`;
  function listRows(l, current) {

  function panelHtml() {

        ${proseHtml([tx(L_.cleanPlain, { na: C.records.excluded_not_approved })], tx(L_.cleanTech, { older: C.cleaning.older_version_columns }))}`;
    }

      return `${head(L_.linkNode)}<h3>${esc(L_.linkTitle)}</h3><p class="big">${nf(k.records)} → ${nf(k.people)}<small>${esc(L_.records)} → ${esc(L_.people)}</small></p>${statusHtml("review")}
        <div class="chips">${[[k.cross_type_links, L_.linkStats.cross], [k.pairs_for_review, L_.linkStats.review], [k.clusters_for_review, L_.linkStats.clusters]].map(([v, l]) => `<span class="chip"><b>${nf(v)}</b> ${esc(l)}</span>`).join("")}</div>
        <p class="sub">${esc(L_.byRecords)}</p><div class="bars6">${keys.map((x) => `<div class="cb"><span class="v">${nf(pb[x])}</span><span class="b" style="height:${f1(Math.max(2, 100 * pb[x] / mx))}%"></span></div>`).join("")}</div><div class="bars6-x">${keys.map((x) => `<span>${x}</span>`).join("")}</div><p class="kicker">${esc(L_.recordsPerPerson)}</p>
        ${proseHtml(L_.linkPlain, tx(L_.linkTech, { thr: String(k.threshold).replace(".", S.lang === "es" ? "," : "."), grey: nf(k.grey_zone_pairs), cand: nf(k.candidate_pairs) }))}`;
    }

      return `${head(L_.criteriaKicker)}<h3>${esc(L_.criteriaTitle)}</h3>${statusHtml("sign")}<p class="prose">${esc(L_.criteriaPlain)}</p>
        <div class="steps">${f.slice(1).map((st) => `<button type="button" data-pick="step:${st.key}" class="${st.excluded ? "" : "zero"}"${st.excluded ? "" : " disabled"}><b>${nf(st.excluded)}</b><span>${esc(tx(L_.step[st.key], { win: winL(S.win) }))}</span></button>`).join("")}</div>`;

        <p class="kicker">${esc(L_.byList)}</p>${chipsByList(st.excluded_by_list)}${proseHtml([L_.stepPlain[key]], L_.stepTech[key])}`;
    }
    if (g === "cohort") {
      const last = f[f.length - 1];
      return `${head(winL(S.win))}<h3>${esc(L_.cohortTitle)}</h3><p class="big">${nf(last.remaining)}<small>${esc(L_.people)}</small></p>${statusHtml("sign")}<p class="kicker">${esc(L_.cohortByList)}</p>${chipsByList(last.remaining_by_list)}${proseHtml([tx(L_.cohortPlain, { win: winL(S.win) })], null)}`;
    }
    if (g === "venn") return `${head(winL(S.win))}<h3>${esc(L_.vennTitle)}</h3>${statusHtml("done")}${histTable()}${proseHtml(L_.vennPlain, L_.vennTech)}`;
    if (g === "hidden") return `${head(L_.hiddenKicker)}<h3>${esc(L_.hiddenTitle)}</h3>${statusHtml("soon")}${proseHtml([L_.hiddenPlain], null)}`;
    return head("");
  }
  function renderPanel() {
    const panel = document.getElementById("panel");
    panel.innerHTML = panelHtml();
    panel.classList.toggle("sheet", !!S.sel && mq("(max-width: 959.98px)"));
  }

  /* ------------------------------------------------------------ next steps */
  function nextHtml() {
    const L_ = L(); const m = C.model_space_size; const grid = C.model_grid;
    const dep = (p) => p.length === 0 ? L_.depNone : p.length === 3 ? L_.depAll : p.map((x) => x[0] + "–" + x[1]).join(", ");
    const covShort = (c) => c.length === 0 ? "—" : c.map((x) => L_.covAbbr[x]).join("");
    const covLong = (c) => c.length === 0 ? L_.covNone : c.map((x) => L_.covNames[x]).join(", ");
    const cells = grid.pairs.map((p) => `<span class="rh">${esc(dep(p))}</span>${grid.covariates.map((c) => { const t = tx(L_.tip, { dep: dep(p), cov: covLong(c) }); return `<span class="m" data-tip="${esc(t)}"></span>`; }).join("")}`).join("");
    return `<div class="next-head"><div class="ticks" aria-hidden="true">${"<i></i>".repeat(8)}</div><p class="eyebrow">${esc(L_.nextEyebrow)}</p><h2>${esc(L_.nextTitle)}</h2></div>
      <div class="next-grid">
        <article class="card"><div class="top"><span class="ico">${ICON.analysis}</span>${statusHtml("soon")}</div><h3>${esc(L_.estTitle)}</h3>
          <p class="body">${esc(tx(L_.estPlain, { m }))}</p>
          <div class="mgrid" role="img" aria-label="${esc(tx(L_.gridLabel, { m, rows: grid.pairs.length, cols: grid.covariates.length }))}" style="--cols:${grid.covariates.length}"><span></span>${grid.covariates.map((c) => `<span class="ch">${esc(covShort(c))}</span>`).join("")}${cells}</div>
          <p class="mtip" id="mtip" aria-live="polite"></p><p class="note">${esc(L_.estCap)}</p></article>
        <article class="card"><div class="top"><span class="ico">${ICON.territory}</span>${statusHtml("soon")}</div><h3>${esc(L_.ratesTitle)}</h3>
          <p class="body">${esc(L_.ratesPlain)}</p>
          <div class="munis"><div class="mt" aria-hidden="true">${C.municipality_names.map(() => "<i></i>").join("")}</div><ul>${C.municipality_names.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>
          <p class="note">${esc(tx(L_.ratesCap, { n: C.municipalities }))}</p></article>
      </div>`;
  }

  /* --------------------------------------------------------------- render */
  function render() {
    const L_ = L();
    document.documentElement.lang = S.lang;
    document.title = L_.docTitle;
    document.querySelectorAll("#langToggle button").forEach((b) => b.setAttribute("aria-current", String(b.dataset.lang === S.lang)));
    document.getElementById("langToggle").setAttribute("aria-label", L_.langLabel);
    document.getElementById("heroLogoReverse").innerHTML = S.lang === "es" ? LOGO.reverse_es : LOGO.reverse;
    document.getElementById("heroLogoPrimary").innerHTML = S.lang === "es" ? LOGO.primary_es : LOGO.primary;
    document.getElementById("heroEyebrow").textContent = L_.eyebrow;
    document.getElementById("heroTitle").textContent = L_.title;
    document.getElementById("heroLead").innerHTML = L_.lead;
    document.getElementById("heroPrelim").innerHTML = ICON.alert + "<span>" + esc(tx(L_.prelim, { date: dateLong(C.extracted) })) + "</span>";
    const main = C.flows.main[MAIN_WIN];
    const vals = [C.export.records, main[0].remaining, main[main.length - 1].remaining];
    document.getElementById("heroStats").innerHTML = L_.stats.map(([a, b], i) => `<div class="stat"><span class="v">${nf(vals[i])}</span><span class="l"><b>${esc(a)}</b>${esc(tx(b, { inst: C.export.institutions, win: winL(MAIN_WIN) }))}</span></div>`).join("");
    figureHead(); renderPanel();
    document.getElementById("next").innerHTML = nextHtml();
    document.getElementById("pageFooter").innerHTML = `<p>${esc(tx(L_.footer, { date: C.extracted, v: C.version }))}</p>`;
    drawCanvas(false);
  }

  /* --------------------------------------------------------------- events */
  function select(id, focusId) {
    S.sel = id; renderPanel(); applySelection(); hideTip();
    if (focusId) { const el = document.querySelector(`#canvas [data-id="${focusId}"][tabindex]`); if (el) el.focus(); }
  }
  const tipEl = () => document.getElementById("tip");
  function hideTip() { const t = tipEl(); if (t) t.hidden = true; }
  function showTip(id, x, y) {
    const t = tipEl(); const canvas = document.getElementById("canvas"); const tip = TIPS[id];
    if (!t || !tip) { hideTip(); return; }
    t.innerHTML = `<b>${esc(tip[0])}</b><span>${esc(tip[1])}</span>`; t.hidden = false;
    const w = canvas.clientWidth; const tw = t.offsetWidth || 220;
    t.style.left = Math.max(0, Math.min(x + 14, w - tw - 4)) + "px"; t.style.top = (y + 16) + "px";
  }
  document.addEventListener("click", (e) => {
    const lang = e.target.closest("#langToggle button");
    if (lang) { if (lang.dataset.lang !== S.lang) { S.lang = lang.dataset.lang; store.set("stept1d-lang", S.lang); render(); } return; }
    if (e.target.closest("#tblToggle")) { S.tables = !S.tables; figureHead(); document.getElementById("tblToggle").focus(); return; }
    if (e.target.closest("[data-close]")) { select(null); return; }
    const pick = e.target.closest("[data-pick]");
    if (pick) { select(pick.dataset.pick); return; }
    const hit = e.target.closest("#canvas [data-id]");
    if (hit) { const id = hit.dataset.id; select(S.sel === id ? null : id); }
  });
  document.addEventListener("keydown", (e) => {
    const el = e.target.closest && e.target.closest("#canvas [data-id][tabindex]");
    if (el && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); const id = el.dataset.id; select(S.sel === id ? null : id, id); return; }
    if (e.key === "Escape" && S.sel) { const id = S.sel; select(null); const back = document.querySelector(`#canvas [data-id="${id}"][tabindex]`); if (back) back.focus(); }
  });
  document.addEventListener("change", (e) => {
    if (e.target.name === "win") S.win = e.target.value; else if (e.target.name === "rule") S.rule = e.target.value; else return;
    const id = e.target.id;
    if (S.sel && S.sel.startsWith("step:") && !flow().some((st) => st.key === S.sel.split(":")[1] && st.excluded > 0)) S.sel = null;
    figureHead(); renderPanel(); drawCanvas(true);
    const el = document.getElementById(id); if (el) el.focus();
  });
  document.addEventListener("pointermove", (e) => {
    const el = e.target.closest && e.target.closest("#canvas [data-id]");
    if (!el || !TIPS[el.dataset.id]) { hideTip(); return; }
    const r = document.getElementById("canvas").getBoundingClientRect(); showTip(el.dataset.id, e.clientX - r.left, e.clientY - r.top);
  });
  document.addEventListener("focusin", (e) => {
    const m = e.target.closest && e.target.closest(".mgrid .m"); const out = document.getElementById("mtip");
    if (m && out) out.textContent = m.dataset.tip;
    const el = e.target.closest && e.target.closest("#canvas [data-id][tabindex]");
    if (el && TIPS[el.dataset.id]) { const r = document.getElementById("canvas").getBoundingClientRect(); const b = el.getBoundingClientRect(); showTip(el.dataset.id, b.right - r.left - 40, b.bottom - r.top - 8); }
  });
  document.addEventListener("focusout", hideTip);
  document.addEventListener("mouseover", (e) => { const m = e.target.closest && e.target.closest(".mgrid .m"); const out = document.getElementById("mtip"); if (m && out) out.textContent = m.dataset.tip; });
  let rz; let lastW = 0;
  window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => {
    const w = document.getElementById("canvas").clientWidth; if (w !== lastW) { lastW = w; drawCanvas(false); }
    document.getElementById("panel").classList.toggle("sheet", !!S.sel && mq("(max-width: 959.98px)"));
  }, 120); });

  render();
  lastW = document.getElementById("canvas").clientWidth;
})();
</script>

</body>
</html>
