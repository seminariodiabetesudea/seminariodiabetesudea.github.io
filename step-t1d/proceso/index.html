<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta property="og:title" content="Mapa del proceso STEP-T1D">
<meta property="og:description" content="Cómo STEP-T1D convierte historias clínicas de doce instituciones en una estimación de la diabetes tipo 1 en el Valle de Aburrá. Cifras preliminares.">
<title>STEP-T1D process map</title>
<meta name="description" content="How STEP-T1D turns clinical charts from twelve institutions into an estimate of type 1 diabetes in the Valle de Aburrá.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@450;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: a brand-ink hero, then an eight-stage process map (the measure rule is its spine,
   one tick per stage) and the stages themselves, each expandable in place.
   Tokens: copied from the STEP-T1D design system (tokens.css, version 1793527154-db53). */
:root {
  --brand-ink:#0c2340; --brand-blue:#3a70ab; --brand-lens:#6c99c7; --brand-drop:#c8382c; --on-ink:#ffffff; --on-ink-soft:#d5e2f0;
  --surface:#ffffff; --surface-subtle:#f2f5f9; --surface-raised:#ffffff; --surface-wash:#f1f8ff; --surface-sunken:#e7ecf0; --surface-chart:#f8fafd;
  --border-hairline:#e7ecf0; --border:#d6dbe1; --border-strong:#b8bec5; --border-control:#6e757d;
  --text:#0c2340; --text-secondary:#555c63; --text-muted:#6e757d; --text-link:#24588f; --text-link-hover:#16416d; --text-drop:#a8261c;
  --accent:#3a70ab; --accent-hover:#24588f; --accent-quiet:#6c99c7; --on-accent:#ffffff; --focus-ring:#5283ba;
  --status-good:#0e664d; --status-warning:#8c5e0f;
  --chart-cat-1:#3a70ab; --chart-cat-2:#c8382c; --chart-cat-3:#1d9fa0; --chart-grid:#e7ecf0; --chart-axis:#b8bec5; --chart-nodata:#e7ecf0;
  --shadow-sm:0 1px 2px rgba(12,35,64,.06),0 1px 1px rgba(12,35,64,.04); --shadow-md:0 2px 4px rgba(12,35,64,.06),0 8px 16px -6px rgba(12,35,64,.10);
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px; --space-6:24px; --space-8:32px; --space-10:40px; --space-12:48px; --space-16:64px;
  --radius-xs:3px; --radius-sm:6px; --radius-md:10px; --radius-lg:16px; --radius-full:9999px;
  --font-display:Archivo,"Helvetica Neue",Helvetica,Arial,sans-serif;
  --font-text:"Source Serif 4",Georgia,"Times New Roman",serif;
  --font-data:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --surface:#0c1723; --surface-subtle:#172534; --surface-raised:#1a2838; --surface-wash:#1c2d3f; --surface-sunken:#060f19; --surface-chart:#0e1a26;
  --border-hairline:#293747; --border:#38485a; --border-strong:#4d5f75; --border-control:#8894a1;
  --text:#e7eef5; --text-secondary:#aeb9c5; --text-muted:#8894a1; --text-link:#8dbbf0; --text-link-hover:#b0d5fe; --text-drop:#f68676;
  --accent:#76a9e2; --accent-hover:#b0d5fe; --accent-quiet:#6c99c7; --on-accent:#0c2340; --focus-ring:#76afee;
  --status-good:#46b591; --status-warning:#eaa948;
  --chart-cat-1:#4b8fd9; --chart-cat-2:#de5c4d; --chart-cat-3:#1ea4a5; --chart-grid:#223246; --chart-axis:#4d5f75; --chart-nodata:#293747;
  --shadow-sm:0 1px 2px rgba(0,0,0,.5); --shadow-md:0 2px 4px rgba(0,0,0,.4),0 8px 16px -6px rgba(0,0,0,.55);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --surface:#0c1723; --surface-subtle:#172534; --surface-raised:#1a2838; --surface-wash:#1c2d3f; --surface-sunken:#060f19; --surface-chart:#0e1a26;
  --border-hairline:#293747; --border:#38485a; --border-strong:#4d5f75; --border-control:#8894a1;
  --text:#e7eef5; --text-secondary:#aeb9c5; --text-muted:#8894a1; --text-link:#8dbbf0; --text-link-hover:#b0d5fe; --text-drop:#f68676;
  --accent:#76a9e2; --accent-hover:#b0d5fe; --accent-quiet:#6c99c7; --on-accent:#0c2340; --focus-ring:#76afee;
  --status-good:#46b591; --status-warning:#eaa948;
  --chart-cat-1:#4b8fd9; --chart-cat-2:#de5c4d; --chart-cat-3:#1ea4a5; --chart-grid:#223246; --chart-axis:#4d5f75; --chart-nodata:#293747;
  --shadow-sm:0 1px 2px rgba(0,0,0,.5); --shadow-md:0 2px 4px rgba(0,0,0,.4),0 8px 16px -6px rgba(0,0,0,.55);
  color-scheme: dark; }

*,*::before,*::after { box-sizing:border-box; }
[hidden] { display:none!important; }
body { margin:0; background:var(--surface); color:var(--text); font-family:var(--font-display); -webkit-font-smoothing:antialiased; }
h1,h2,h3,p,ol,ul,figure { margin:0; }
ol,ul { padding:0; list-style:none; }
.wrap { max-width:1200px; margin:0 auto; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); }
.num { font-variant-numeric:tabular-nums; }
:focus-visible { outline:2px solid var(--focus-ring); outline-offset:2px; border-radius:var(--radius-xs); }
button { font:inherit; color:inherit; }
@media (prefers-reduced-motion: reduce) { *,*::before,*::after { transition:none!important; animation:none!important; scroll-behavior:auto!important; } }

/* measure rule */
.rule { display:flex; align-items:flex-end; height:10px; }
.rule i { display:block; width:1px; height:4px; background:var(--brand-lens); margin-right:15px; }
.rule i:nth-child(5n+1) { height:9px; background:var(--border-strong); }
.rule .line { flex:1; height:1px; background:var(--border-hairline); }
.hero .rule i:nth-child(5n+1) { background:var(--on-ink-soft); }
.hero .rule .line { background:rgba(213,226,240,.25); }
.eyebrow { font-size:12px; line-height:16px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); }

/* hero */
.hero { background:var(--brand-ink); color:var(--on-ink); padding-block:var(--space-12) var(--space-10); }
.hero-grid { display:grid; gap:var(--space-6); }
.hero-top { display:flex; align-items:flex-start; justify-content:space-between; gap:var(--space-4); flex-wrap:wrap; }
.hero-top svg.logo { width:220px; height:auto; flex:none; }
.hero .eyebrow { color:var(--on-ink-soft); }
.hero h1 { font-size:clamp(32px, 5vw, 44px); line-height:1.1; font-weight:700; letter-spacing:-.02em; text-wrap:balance; max-width:22ch; }
.hero .lead { font-family:var(--font-text); font-size:18px; line-height:30px; color:var(--on-ink-soft); max-width:62ch; }
.hero .lead strong { color:var(--on-ink); font-weight:600; }
.lang { display:inline-flex; border:1px solid rgba(213,226,240,.5); border-radius:var(--radius-sm); overflow:hidden; }
.lang button { background:transparent; border:0; padding:6px 12px; font-size:13px; font-weight:600; letter-spacing:.04em; color:var(--on-ink-soft); cursor:pointer; }
.lang button[aria-current="true"] { background:var(--on-ink); color:var(--brand-ink); }
.prelim { display:inline-flex; align-items:center; gap:var(--space-2); font-size:13px; line-height:18px; font-weight:500; color:var(--status-warning); }
.prelim svg { width:15px; height:15px; flex:none; }
.hero .prelim { color:#eaa948; }

/* process map (overview) */
.mapband { background:var(--surface-subtle); border-bottom:1px solid var(--border-hairline); padding-block:var(--space-8); }
.map-scroll { overflow-x:auto; padding-bottom:var(--space-2); -webkit-overflow-scrolling:touch; }
.map { display:flex; align-items:stretch; gap:0; min-width:max-content; }
.node { display:flex; align-items:stretch; }
.node a { display:grid; grid-template-rows:auto auto 1fr; gap:var(--space-1); width:132px; padding:var(--space-3); border-radius:var(--radius-md);
  background:var(--surface-raised); border:1px solid var(--border); box-shadow:var(--shadow-sm); color:var(--text); text-decoration:none;
  transition:border-color .15s ease, box-shadow .15s ease, transform .15s ease; }
.node a:hover { border-color:var(--accent-quiet); box-shadow:var(--shadow-md); transform:translateY(-1px); }
.node a[aria-current="true"] { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent), var(--shadow-md); }
.node .step { font-family:var(--font-data); font-size:11px; color:var(--text-muted); display:flex; justify-content:space-between; align-items:center; }
.node .step svg { width:20px; height:20px; color:var(--border-control); }
.node a[aria-current="true"] .step svg { color:var(--accent); }
.node .nm { font-size:14px; line-height:18px; font-weight:600; }
.node .fig { font-size:20px; line-height:24px; font-weight:700; letter-spacing:-.01em; font-variant-numeric:tabular-nums; align-self:end; }
.node .fig small { display:block; font-family:var(--font-data); font-size:11px; line-height:14px; font-weight:450; color:var(--text-muted); letter-spacing:0; }
.node .fig.soon { font-size:13px; line-height:18px; color:var(--text-muted); font-weight:500; }
.arrow { display:flex; align-items:center; width:28px; color:var(--border-strong); flex:none; }
.arrow svg { width:28px; height:12px; }

/* controls */
.controls { display:flex; flex-wrap:wrap; gap:var(--space-4) var(--space-8); align-items:flex-end; padding-block:var(--space-6) 0; }
.ctl { display:grid; gap:var(--space-2); min-width:0; }
.ctl .lbl { font-size:12px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--text-muted); }
.seg { display:flex; flex-wrap:wrap; gap:var(--space-1); }
.seg label { position:relative; }
.seg input { position:absolute; opacity:0; inset:0; margin:0; cursor:pointer; }
.seg span { display:inline-block; padding:7px 12px; border:1px solid var(--border); border-radius:var(--radius-sm); font-size:13px; line-height:18px; font-weight:500; color:var(--text-secondary); background:var(--surface); cursor:pointer; }
.seg input:checked + span { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
.seg input:focus-visible + span { outline:2px solid var(--focus-ring); outline-offset:2px; }
.delta { font-family:var(--font-data); font-size:12px; color:var(--text-secondary); min-height:17px; }

/* stages */
.stages { display:grid; gap:var(--space-4); padding-block:var(--space-8) var(--space-16); }
.stage { border:1px solid var(--border); border-radius:var(--radius-lg); background:var(--surface-raised); overflow:hidden; scroll-margin-top:16px; }
.stage-head { width:100%; display:grid; grid-template-columns:auto 1fr auto; gap:var(--space-4); align-items:center; padding:var(--space-5) var(--space-6);
  background:transparent; border:0; text-align:left; cursor:pointer; }
.stage-head:hover { background:var(--surface-wash); }
.stage-ico { width:44px; height:44px; border-radius:var(--radius-md); background:var(--surface-wash); color:var(--accent); display:grid; place-items:center; flex:none; }
.stage-ico svg { width:24px; height:24px; }
.stage-title { display:grid; gap:2px; min-width:0; }
.stage-title .k { font-family:var(--font-data); font-size:12px; color:var(--text-muted); }
.stage-title h2 { font-size:19px; line-height:26px; font-weight:600; text-wrap:balance; }
.stage-title .sum { font-family:var(--font-text); font-size:15px; line-height:23px; color:var(--text-secondary); }
.stage-side { display:flex; align-items:center; gap:var(--space-4); }
.chev { width:20px; height:20px; color:var(--border-control); transition:transform .2s ease; }
.stage-head[aria-expanded="true"] .chev { transform:rotate(180deg); }
.status { display:inline-flex; align-items:center; gap:6px; font-size:13px; line-height:18px; font-weight:500; white-space:nowrap; }
.status svg { width:15px; height:15px; }
.status.done { color:var(--status-good); } .status.sign, .status.review { color:var(--status-warning); } .status.soon { color:var(--text-muted); }
.stage-body { padding:0 var(--space-6) var(--space-6); display:grid; gap:var(--space-6); border-top:1px solid var(--border-hairline); padding-top:var(--space-6); }
.cols { display:grid; grid-template-columns:minmax(0, 5fr) minmax(0, 7fr); gap:var(--space-8); align-items:start; }
.prose { font-family:var(--font-text); font-size:16px; line-height:27px; color:var(--text); max-width:62ch; display:grid; gap:var(--space-3); }
.prose .plain-label, .tech summary { font-family:var(--font-display); font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); }
.tech { border-top:1px solid var(--border-hairline); padding-top:var(--space-3); }
.tech summary { cursor:pointer; list-style:none; display:flex; align-items:center; gap:var(--space-2); }
.tech summary::-webkit-details-marker { display:none; }
.tech summary::before { content:"+"; font-family:var(--font-data); font-size:15px; width:12px; }
.tech[open] summary::before { content:"–"; }
.tech p { font-family:var(--font-text); font-size:14px; line-height:23px; color:var(--text-secondary); margin-top:var(--space-2); }
.tech code, .data { font-family:var(--font-data); font-size:.92em; }
.stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:var(--space-4); }
.stat { display:grid; gap:2px; padding:var(--space-4); border:1px solid var(--border); border-radius:var(--radius-md); background:var(--surface); }
.stat .v { font-size:28px; line-height:32px; font-weight:700; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
.stat .u { font-family:var(--font-data); font-size:12px; color:var(--text-secondary); }
.stat .l { font-size:14px; line-height:19px; font-weight:500; color:var(--text); }

/* figure anatomy */
.fig { background:var(--surface-chart); border:1px solid var(--border); border-radius:var(--radius-lg); padding:var(--space-5); display:grid; gap:var(--space-3); min-width:0; }
.fig .fnum { font-size:12px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--text-muted); }
.fig h3 { font-size:16px; line-height:22px; font-weight:600; text-wrap:balance; }
.fig .cap { font-size:13px; line-height:19px; color:var(--text-secondary); }
.fig .src { font-family:var(--font-data); font-size:12px; line-height:17px; color:var(--text-muted); }
.legend { display:flex; flex-wrap:wrap; gap:var(--space-2) var(--space-5); }
.legend span { display:inline-flex; align-items:center; gap:var(--space-2); font-size:13px; font-weight:500; color:var(--text-secondary); }
.legend i { width:10px; height:10px; border-radius:var(--radius-xs); flex:none; }
.tbl-toggle { justify-self:start; background:transparent; border:0; padding:0; color:var(--text-link); font-size:14px; font-weight:500; cursor:pointer; text-decoration:underline; text-underline-offset:3px; }
.tbl-wrap { overflow-x:auto; }
table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
th, td { text-align:left; padding:var(--space-2) var(--space-3); }
thead th { background:var(--surface-subtle); font-size:13px; font-weight:600; color:var(--text-secondary); border-bottom:1px solid var(--border); }
td { font-family:var(--font-data); font-size:13px; border-bottom:1px solid var(--border-hairline); }
td:first-child { font-family:var(--font-display); font-weight:500; }
th.n, td.n { text-align:right; }

/* stacked bar (records by list) */
.stack { display:flex; height:28px; border-radius:var(--radius-xs); overflow:hidden; gap:2px; background:var(--surface-chart); }
.stack div { display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; color:#fff; font-variant-numeric:tabular-nums; min-width:0; }

/* lists and institutions */
.lists { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:var(--space-4); }
.list { border:1px solid var(--border); border-radius:var(--radius-md); background:var(--surface); padding:var(--space-4); display:grid; gap:var(--space-3); align-content:start; min-width:0; }
.list-h { display:grid; gap:2px; }
.list-h .id { display:flex; align-items:center; gap:var(--space-2); font-size:13px; font-weight:700; letter-spacing:.06em; }
.list-h .id i { width:12px; height:12px; border-radius:var(--radius-xs); }
.list-h .meaning { font-size:15px; line-height:20px; font-weight:600; }
.list-h .tot { font-family:var(--font-data); font-size:12px; color:var(--text-muted); }
.inst { width:100%; display:grid; gap:4px; padding:var(--space-2); border:1px solid transparent; border-radius:var(--radius-sm); background:transparent; text-align:left; cursor:pointer; }
.inst:hover { background:var(--surface-wash); }
.inst[aria-expanded="true"] { border-color:var(--accent-quiet); background:var(--surface-wash); }
.inst .row { display:flex; justify-content:space-between; gap:var(--space-2); font-size:14px; line-height:18px; font-weight:500; }
.inst .row .n { font-family:var(--font-data); font-size:12px; color:var(--text-secondary); white-space:nowrap; }
.inst .bar { height:6px; border-radius:var(--radius-xs); background:var(--chart-grid); overflow:hidden; }
.inst .bar i { display:block; height:100%; border-radius:0 var(--radius-xs) var(--radius-xs) 0; }
.inst-detail { padding:var(--space-3); border-radius:var(--radius-sm); background:var(--surface-subtle); display:grid; gap:var(--space-2); font-size:13px; line-height:19px; color:var(--text-secondary); }
.tags { display:flex; flex-wrap:wrap; gap:var(--space-1); }
.tag { font-family:var(--font-data); font-size:12px; padding:2px 8px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--surface); color:var(--text-secondary); }

/* flow (who counts) */
.flow { display:grid; gap:var(--space-2); }
.frow { display:grid; grid-template-columns:minmax(0, 1.25fr) minmax(0, 1fr); gap:var(--space-4); align-items:center; padding:var(--space-2) 0; border-bottom:1px solid var(--border-hairline); }
.frow:last-child { border-bottom:0; }
.frow .t { font-size:14px; line-height:19px; font-weight:500; }
.frow .x { font-family:var(--font-data); font-size:12px; color:var(--text-secondary); display:flex; flex-wrap:wrap; gap:2px var(--space-3); margin-top:2px; }
.frow .x b { color:var(--text); font-weight:500; }
.frow .x i { display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:4px; }
.fbar { display:grid; gap:4px; }
.fbar .track { height:14px; background:var(--chart-grid); border-radius:var(--radius-xs); overflow:hidden; }
.fbar .track i { display:block; height:100%; background:var(--chart-cat-1); border-radius:0 var(--radius-xs) var(--radius-xs) 0; transition:width .35s ease; }
.fbar .r { font-family:var(--font-data); font-size:12px; color:var(--text-secondary); text-align:right; }
.frow.first .t, .frow.last .t { font-weight:700; }
.frow.last .fbar .track i { background:var(--accent); }

/* venn */
.venn svg { width:100%; max-width:520px; height:auto; display:block; margin:0 auto; }
.venn .ring { fill-opacity:.12; stroke-width:2; }
.venn .lab { font-family:var(--font-display); font-size:13px; font-weight:700; fill:var(--text); }
.venn .cnt { font-family:var(--font-display); font-size:17px; font-weight:700; fill:var(--text); font-variant-numeric:tabular-nums; }
.venn .hid { fill:var(--brand-drop); font-family:var(--font-display); font-size:34px; font-weight:700; }
.venn .hidl { font-family:var(--font-display); font-size:12px; fill:var(--text-secondary); }

/* model grid */
.mgrid { display:grid; grid-template-columns:auto repeat(8, minmax(0, 1fr)); gap:4px; align-items:center; font-size:11px; }
.mgrid .rh { font-size:12px; color:var(--text-secondary); padding-right:var(--space-2); white-space:nowrap; }
.mgrid .ch { font-family:var(--font-data); font-size:10px; color:var(--text-muted); text-align:center; line-height:12px; }
.mgrid .m { aspect-ratio:1; max-width:100%; border-radius:var(--radius-xs); background:var(--surface-wash); border:1px solid var(--accent-quiet); }
.mgrid .m:hover, .mgrid .m:focus-visible { background:var(--accent); }
.mtip { font-family:var(--font-data); font-size:12px; color:var(--text-secondary); min-height:17px; }

/* municipalities rule */
.munis { display:grid; gap:var(--space-2); }
.munis .rule i { margin-right:calc((100% - 10px) / 9 - 1px); }
.munis ul { display:grid; grid-template-columns:repeat(5, minmax(0, 1fr)); gap:var(--space-2) var(--space-4); font-size:13px; color:var(--text-secondary); }

/* bars (people by number of records) */
.cols-bars { display:grid; grid-template-columns:repeat(6, minmax(0, 1fr)); gap:var(--space-2); align-items:end; height:150px; }
.cb { display:grid; grid-template-rows:auto 1fr; gap:4px; height:100%; align-items:end; text-align:center; }
.cb .v { font-family:var(--font-data); font-size:12px; color:var(--text); }
.cb .b { background:var(--chart-cat-1); border-radius:var(--radius-xs) var(--radius-xs) 0 0; min-height:2px; }
.cb-x { display:grid; grid-template-columns:repeat(6, minmax(0, 1fr)); gap:var(--space-2); text-align:center; font-family:var(--font-data); font-size:12px; color:var(--text-muted); border-top:1px solid var(--chart-axis); padding-top:4px; }

  const MUNICIPALITIES = ["Medellín", "Barbosa", "Bello", "Caldas", "Copacabana", "Envigado", "Girardota", "Itagüí", "La Estrella", "Sabaneta"];
  const LIST_COLOR = { A: "var(--chart-cat-1)", B: "var(--chart-cat-2)", C: "var(--chart-cat-3)" };

  /* ---------- state ---------- */
  const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  const navLang = (navigator.language || "es").toLowerCase().startsWith("en") ? "en" : "es";
  const S = { lang: store.get("stept1d-lang") || navLang, win: "2015-2024", rule: "main", open: new Set(["lists", "who"]), inst: null, tables: new Set() };

  /* ---------- helpers ---------- */
  const NBSP = " ";
  const nf = (n) => (n === null || n === undefined) ? "—" : String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, NBSP);
  const sf = (n) => (n > 0 ? "+" : n < 0 ? "−" : "") + nf(Math.abs(n));
  const tx = (s, v) => s.replace(/\{(\w+)\}/g, (m, k) => (v && k in v) ? v[k] : m);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const L = () => T[S.lang];
  const dateLong = (iso) => {
    const d = new Date(iso + "T12:00:00");
    return d.toLocaleDateString(S.lang === "es" ? "es-CO" : "en-GB", { day: "numeric", month: "long", year: "numeric" });
  };
  const winLabel = (w) => w.replace("-", "–");
  const flow = (rule, win) => C.flows[rule][win];
  const finalN = (rule, win) => { const f = flow(rule, win); return f[f.length - 1].remaining; };
  const hist = () => C.histories[S.rule][S.win];
  const multi = (h) => h.AB + h.AC + h.BC + h.ABC;
  const recordsByList = () => Object.fromEntries(C.lists.map((l) => [l.id, l.institutions.reduce((a, i) => a + i.records, 0)]));
  const source = () => `<p class="src">${esc(tx(L().source, { date: C.extracted, v: C.version }))}</p>`;
  const statusHtml = (st) => {
    const ic = st === "done" ? ICON.check : st === "soon" ? "" : ICON.alert;
    return `<span class="status ${st}">${ic}${esc(L().status[st])}</span>`;
  };
  let figNo = 0;
  const figure = (title, plot, cap, table) => {
    figNo += 1;
    const id = `tbl-${figNo}`;
    const open = S.tables.has(id);
    return `<figure class="fig"><p class="fnum">${esc(tx(L().figure, { n: figNo }))}</p><h3>${esc(title)}</h3>${plot}
      <p class="cap">${esc(cap)}</p>${source()}
      ${table ? `<button type="button" class="tbl-toggle" data-table="${id}" aria-expanded="${open}" aria-controls="${id}">${esc(open ? L().hideTable : L().showTable)}</button>
      <div class="tbl-wrap" id="${id}" ${open ? "" : "hidden"}>${table}</div>` : ""}</figure>`;
  };
  const legend = () => `<div class="legend">${["A", "B", "C"].map((id) => `<span><i style="background:${LIST_COLOR[id]}"></i>${id} · ${esc(L().lists[id])}</span>`).join("")}</div>`;

  /* ---------- stage bodies ---------- */
  function bodyCollect(s) {
    const r = recordsByList(); const tot = r.A + r.B + r.C;
    const bar = `<div class="stack" role="img" aria-label="${esc(["A", "B", "C"].map((id) => `${id}: ${nf(r[id])}`).join(", "))}">${["A", "B", "C"].map((id) => `<div style="width:${(100 * r[id] / tot).toFixed(2)}%;background:${LIST_COLOR[id]}">${nf(r[id])}</div>`).join("")}</div>`;
    const table = `<table><thead><tr><th>${esc(L().stages.who.th[0].replace(/.*/, S.lang === "es" ? "Lista" : "List"))}</th><th class="n">${esc(L().records)}</th></tr></thead><tbody>${["A", "B", "C"].map((id) => `<tr><td>${id} · ${esc(L().lists[id])}</td><td class="n">${nf(r[id])}</td></tr>`).join("")}</tbody></table>`;
    return cols(prose(s, { first: dateLong(C.export.submission_first), last: dateLong(C.export.submission_last), inst: C.export.institutions, records: nf(C.export.records) },
      { records: nf(C.export.records), columns: C.export.columns, versions: C.export.form_versions }),
      figure(s.figTitle, legend() + bar, s.figCap, table));
  }
  function bodyClean(s) {
    const c = C.cleaning;
    const st = [[c.placeholder_dx_years, s.stats.dx], [c.placeholder_insulin_years, s.stats.ins], [c.unknown_dx_months, s.stats.mon], [c.older_version_columns, s.stats.cols]];
    return cols(prose(s, {}, { older: c.older_version_columns }),
      `<div class="stats">${st.map(([v, l]) => `<div class="stat"><span class="v">${nf(v)}</span><span class="l">${esc(l)}</span></div>`).join("")}</div>`);
  }
  function bodyLists(s) {
    const max = Math.max(...C.lists.flatMap((l) => l.institutions.map((i) => i.records)));
    const cards = C.lists.map((l) => {
      const tot = l.institutions.reduce((a, i) => a + i.records, 0);
      const rows = l.institutions.map((i) => {
        const id = `inst-${l.id}-${i.name.replace(/[^A-Za-z]/g, "")}`;
        const open = S.inst === id;
        return `<li><button type="button" class="inst" data-inst="${id}" aria-expanded="${open}" aria-controls="${id}-d">
            <span class="row"><span>${esc(i.name)}</span><span class="n">${nf(i.records)}</span></span>
            <span class="bar"><i style="width:${(100 * i.records / max).toFixed(1)}%;background:${LIST_COLOR[l.id]}"></i></span></button>
          <div class="inst-detail" id="${id}-d" ${open ? "" : "hidden"}>
            <span>${esc(tx(s.recs, { n: nf(i.records) }))} · ${esc(s.why[l.id])}</span>
            <span><strong>${esc(s.spellings)}:</strong></span>
            <span class="tags">${i.spellings.map((sp) => `<span class="tag">${esc(sp)}</span>`).join("")}</span></div></li>`;
      }).join("");
      return `<div class="list"><div class="list-h"><span class="id"><i style="background:${LIST_COLOR[l.id]}"></i>${S.lang === "es" ? "LISTA" : "LIST"} ${l.id}</span>
        <span class="meaning">${esc(L().lists[l.id])}</span><span class="tot">${nf(l.institutions.length)} · ${nf(tot)} ${esc(L().records)}</span></div><ul>${rows}</ul></div>`;
    }).join("");
    return `${prose(s, {}, {})}<div class="lists">${cards}</div>${source()}`;
  }
  function bodyLink(s) {
    const k = C.linkage;
    const pb = k.people_by_records; const keys = Object.keys(pb).sort((a, b) => a - b); const mx = Math.max(...keys.map((x) => pb[x]));
    const bars = `<div class="cols-bars" role="img" aria-label="${esc(keys.map((x) => `${x}: ${nf(pb[x])}`).join(", "))}">${keys.map((x) => `<div class="cb"><span class="v">${nf(pb[x])}</span><span class="b" style="height:${Math.max(2, 100 * pb[x] / mx).toFixed(1)}%"></span></div>`).join("")}</div>
      <div class="cb-x">${keys.map((x) => `<span>${x}</span>`).join("")}</div>`;
    const table = `<table><thead><tr><th>${S.lang === "es" ? "Registros por persona" : "Records per person"}</th><th class="n">${esc(L().people)}</th></tr></thead><tbody>${keys.map((x) => `<tr><td>${x}</td><td class="n">${nf(pb[x])}</td></tr>`).join("")}</tbody></table>`;
    const stats = `<div class="stats">${[[k.cross_type_links, s.stats.cross], [k.pairs_for_review, s.stats.review], [k.clusters_for_review, s.stats.clusters]].map(([v, l]) => `<div class="stat"><span class="v">${nf(v)}</span><span class="l">${esc(l)}</span></div>`).join("")}</div>`;
    return cols(prose(s, {}, { thr: String(k.threshold).replace(".", S.lang === "es" ? "," : "."), grey: nf(k.grey_zone_pairs), cand: nf(k.candidate_pairs) }) + stats,
      figure(s.figTitle, bars, s.figCap, table));
  }
  function bodyWho(s) {
    const f = flow(S.rule, S.win); const top = f[0].remaining;
    const rows = f.map((st, i) => {
      const label = tx(s.steps[st.key], { win: winLabel(S.win) });
      const ex = i === 0 ? "" : `<span class="x"><b>${nf(st.excluded)} ${esc(s.out)}</b>${["A", "B", "C"].map((id) => `<span><i style="background:${LIST_COLOR[id]}"></i>${id} ${nf(st.excluded_by_list[id])}</span>`).join("")}</span>`;
      return `<li class="frow ${i === 0 ? "first" : ""} ${i === f.length - 1 ? "last" : ""}"><div><span class="t">${esc(label)}</span>${ex}</div>
        <div class="fbar"><span class="track"><i style="width:${(100 * st.remaining / top).toFixed(1)}%"></i></span><span class="r">${nf(st.remaining)} ${esc(s.stay)}</span></div></li>`;
    }).join("");
    const table = `<table><thead><tr>${s.th.map((h, i) => `<th class="${i ? "n" : ""}">${esc(h)}</th>`).join("")}</tr></thead><tbody>${f.map((st) => `<tr><td>${esc(tx(s.steps[st.key], { win: winLabel(S.win) }))}</td><td class="n">${nf(st.excluded)}</td>${["A", "B", "C"].map((id) => `<td class="n">${nf(st.excluded_by_list[id])}</td>`).join("")}<td class="n">${nf(st.remaining)}</td></tr>`).join("")}</tbody></table>`;
    return cols(prose(s, {}, {}), figure(s.figTitle, legend() + `<ol class="flow">${rows}</ol>`, s.figCap, table));
  }
  function bodyOverlaps(s) {
    const h = hist();
    const pos = { A: [118, 112], B: [302, 112], C: [210, 262], AB: [210, 96], AC: [150, 196], BC: [270, 196], ABC: [210, 166] };
    const svg = `<svg viewBox="0 0 420 330" role="img" aria-label="${esc(Object.entries(h).map(([k, v]) => `${k}: ${nf(v)}`).join(", "))}">
      <circle class="ring" cx="160" cy="135" r="98" fill="var(--chart-cat-1)" stroke="var(--chart-cat-1)"/>
      <circle class="ring" cx="260" cy="135" r="98" fill="var(--chart-cat-2)" stroke="var(--chart-cat-2)"/>
      <circle class="ring" cx="210" cy="222" r="98" fill="var(--chart-cat-3)" stroke="var(--chart-cat-3)"/>
      <text class="lab" x="62" y="40">A</text><text class="lab" x="350" y="40">B</text><text class="lab" x="300" y="318">C</text>
      ${Object.entries(pos).map(([k, [x, y]]) => `<text class="cnt" x="${x}" y="${y}" text-anchor="middle">${nf(h[k])}</text>`).join("")}
      <text class="hid" x="374" y="270" text-anchor="middle">?</text>
      <text class="hidl" x="374" y="292" text-anchor="middle">${esc(s.hidden)}</text>
      <text class="hidl" x="374" y="308" text-anchor="middle">${esc(s.hidden2)}</text></svg>`;
    const order = ["A", "B", "C", "AB", "AC", "BC", "ABC"];
    const table = `<table><thead><tr><th>${esc(s.th[0])}</th><th class="n">${esc(s.th[1])}</th></tr></thead><tbody>${order.map((k) => `<tr><td>${k.split("").join(" + ")}</td><td class="n">${nf(h[k])}</td></tr>`).join("")}<tr><td>${esc(s.none)}</td><td class="n">${esc(s.tbd)}</td></tr></tbody></table>`;
    return cols(prose(s, {}, {}), figure(s.figTitle, legend() + `<div class="venn">${svg}</div>`, s.figCap, table));
  }
  function bodyEstimate(s) {
    const m = C.model_space_size;
    const cells = s.deps.map((d, r) => `<span class="rh">${esc(d)}</span>${s.covs.map((c, k) => `<span class="m" tabindex="0" data-tip="${esc(tx(s.tip, { dep: d, cov: c }))}" aria-label="${esc(tx(s.tip, { dep: d, cov: c }))}"></span>`).join("")}`).join("");
    const head = `<span></span>${s.covs.map((c) => `<span class="ch">${esc(c)}</span>`).join("")}`;
    return cols(prose(s, { models: m }, {}), figure(tx(s.figTitle, { models: m }), `<div class="mgrid">${head}${cells}</div><p class="mtip" id="mtip" aria-live="polite"></p>`, s.figCap, null));
  }
  function bodyRates(s) {
    const ticks = MUNICIPALITIES.map(() => "<i></i>").join("");
    return cols(prose(s, {}, {}), figure(s.figTitle, `<div class="munis"><div class="rule" aria-hidden="true">${ticks}</div><ul>${MUNICIPALITIES.map((m) => `<li>${esc(m)}</li>`).join("")}</ul></div>`, s.figCap, null));
  }
  const BODY = { collect: bodyCollect, clean: bodyClean, lists: bodyLists, link: bodyLink, who: bodyWho, overlaps: bodyOverlaps, estimate: bodyEstimate, rates: bodyRates };

  function prose(s, vPlain, vTech) {
    return `<div class="prose"><p class="plain-label">${esc(L().plain)}</p>${s.plain.map((p) => `<p>${esc(tx(p, vPlain))}</p>`).join("")}
      <details class="tech"><summary>${esc(L().tech)}</summary><p>${esc(tx(s.tech, vTech))}</p></details></div>`;
  }
  function cols(a, b) { return `<div class="cols"><div>${a}</div><div>${b}</div></div>`; }

  function summary(key) {
    const s = L().stages[key];
    const v = {
      collect: { inst: C.export.institutions }, clean: {},
      lists: { spellings: C.export.spellings, inst: C.export.institutions },
      link: { records: nf(C.linkage.records), people: nf(C.linkage.people) },
      who: { n: nf(finalN(S.rule, S.win)), win: winLabel(S.win) },
      overlaps: { n: nf(multi(hist())) }, estimate: { models: C.model_space_size }, rates: { munis: C.municipalities }
    }[key];
    return tx(s.sum, v);
  }
  function nodeFigure(key) {
    const L_ = L();
    switch (key) {
      case "collect": return `${nf(C.export.records)}<small>${esc(L_.records)}</small>`;
      case "clean": return `${nf(C.cleaning.placeholder_dx_years + C.cleaning.placeholder_insulin_years)}<small>${S.lang === "es" ? "códigos a faltante" : "codes to missing"}</small>`;
      case "lists": return `3<small>${nf(C.export.institutions)} ${S.lang === "es" ? "instituciones" : "institutions"}</small>`;
      case "link": return `${nf(C.linkage.people)}<small>${esc(L_.people)}</small>`;
      case "who": return `${nf(finalN(S.rule, S.win))}<small>${esc(L_.people)} · ${winLabel(S.win)}</small>`;
      case "overlaps": return `${nf(multi(hist()))}<small>${S.lang === "es" ? "en 2 o más listas" : "on 2 or more lists"}</small>`;
      default: return null;
    }
  }

  /* ---------- render ---------- */
  function render() {
    const L_ = L();
    document.documentElement.lang = S.lang;
    document.title = S.lang === "es" ? "Mapa del proceso STEP-T1D" : "STEP-T1D process map";
    document.querySelectorAll("#langToggle button").forEach((b) => b.setAttribute("aria-current", String(b.dataset.lang === S.lang)));
    document.getElementById("langToggle").setAttribute("aria-label", S.lang === "es" ? "Idioma" : "Language");
    document.getElementById("heroRule").innerHTML = STAGES.map(() => "<i></i>").join("") + '<span class="line"></span>';
    document.getElementById("heroEyebrow").textContent = L_.eyebrow;
    document.getElementById("heroTitle").textContent = L_.title;
    document.getElementById("heroLead").innerHTML = L_.lead;
    document.getElementById("heroPrelim").innerHTML = ICON.alert + esc(tx(L_.prelim, { date: C.extracted }));
    document.getElementById("mapNav").setAttribute("aria-label", L_.eyebrow);

    document.getElementById("map").innerHTML = STAGES.map((st, i) => {
      const s = L_.stages[st.key]; const fig = nodeFigure(st.key);
      return `<li class="node"><a href="#stage-${st.key}" data-go="${st.key}" aria-current="${S.open.has(st.key)}">
          <span class="step">${String(i + 1).padStart(2, "0")}${ICON[st.icon]}</span><span class="nm">${esc(s.name)}</span>
          <span class="fig ${fig ? "" : "soon"}">${fig || esc(L_.status.soon)}</span></a></li>${i < STAGES.length - 1 ? '<li class="arrow" aria-hidden="true"><svg viewBox="0 0 28 12"><path d="M2 6h22M19 1.5 24 6l-5 4.5" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg></li>' : ""}`;
    }).join("");

    const ruleKeys = ["main", "S5", "S6", "S16"];
    const d = finalN(S.rule, S.win) - finalN("main", S.win);
    document.getElementById("controls").innerHTML = `
      <div class="ctl" role="radiogroup" aria-labelledby="lblWin"><span class="lbl" id="lblWin">${esc(L_.win)}</span><div class="seg">${Object.keys(C.windows).map((w) => `<label><input type="radio" name="win" id="win-${w}" value="${w}" ${S.win === w ? "checked" : ""}><span>${esc(L_.windows[w])}</span></label>`).join("")}</div></div>
      <div class="ctl" role="radiogroup" aria-labelledby="lblRule"><span class="lbl" id="lblRule">${esc(L_.rule)}</span><div class="seg">${ruleKeys.map((r) => `<label><input type="radio" name="rule" id="rule-${r}" value="${r}" ${S.rule === r ? "checked" : ""}><span>${esc(tx(L_.rules[r], { n: C.records.excluded_not_approved }))}</span></label>`).join("")}</div>
      <span class="delta" aria-live="polite">${S.rule === "main" ? "" : esc(d === 0 ? L_.deltaZero : tx(L_.delta, { d: sf(d) }))}</span></div>`;

    figNo = 0;
    document.getElementById("stages").innerHTML = STAGES.map((st, i) => {
      const s = L_.stages[st.key]; const open = S.open.has(st.key);
      return `<li class="stage" id="stage-${st.key}">
        <button type="button" class="stage-head" data-stage="${st.key}" aria-expanded="${open}" aria-controls="body-${st.key}">
          <span class="stage-ico">${ICON[st.icon]}</span>
          <span class="stage-title"><span class="k">${esc(tx(L_.step, { i: i + 1, n: STAGES.length }))}</span><h2>${esc(s.title)}</h2><span class="sum">${esc(summary(st.key))}</span></span>
          <span class="stage-side">${statusHtml(st.status)}<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span>
        </button>
        <div class="stage-body" id="body-${st.key}" ${open ? "" : "hidden"}>${open ? BODY[st.key](s) : ""}</div></li>`;
    }).join("");
    document.getElementById("pageFooter").innerHTML = `<p>${esc(tx(L_.footer, { date: C.extracted, v: C.version }))}</p>`;
  }

  /* ---------- events ---------- */
  document.addEventListener("click", (e) => {
    const lang = e.target.closest("#langToggle button");
    if (lang) { S.lang = lang.dataset.lang; store.set("stept1d-lang", S.lang); render(); return; }
    const head = e.target.closest(".stage-head");
    if (head) { const k = head.dataset.stage; S.open.has(k) ? S.open.delete(k) : S.open.add(k); render(); document.querySelector(`.stage-head[data-stage="${k}"]`).focus(); return; }
    const go = e.target.closest("[data-go]");
    if (go) { e.preventDefault(); const k = go.dataset.go; S.open.add(k); render();
      const el = document.getElementById(`stage-${k}`); el.scrollIntoView({ behavior: "smooth", block: "start" }); el.querySelector(".stage-head").focus({ preventScroll: true }); return; }
    const inst = e.target.closest(".inst");
    if (inst) { S.inst = S.inst === inst.dataset.inst ? null : inst.dataset.inst; render(); const b = document.querySelector(`.inst[data-inst="${inst.dataset.inst}"]`); if (b) b.focus(); return; }
    const tb = e.target.closest(".tbl-toggle");
    if (tb) { const id = tb.dataset.table; S.tables.has(id) ? S.tables.delete(id) : S.tables.add(id); render(); const b = document.querySelector(`.tbl-toggle[data-table="${id}"]`); if (b) b.focus(); }
  });
  document.addEventListener("change", (e) => {
    if (e.target.name === "win") S.win = e.target.value;
    else if (e.target.name === "rule") S.rule = e.target.value;
    else return;
    const id = e.target.id; render(); const el = document.getElementById(id); if (el) el.focus();
  });
  const tip = (e) => { const m = e.target.closest(".mgrid .m"); const out = document.getElementById("mtip"); if (m && out) out.textContent = m.dataset.tip; };
  document.addEventListener("mouseover", tip);
